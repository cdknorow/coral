{id:'test',title:'Test',state:!buildReady?'blocked':tested?'success':failed?'failed':'working',summary:!buildReady?'Waiting for Build to publish its candidate.':tested?'Verification passed for demo-r42.':failed?'Verification failed for demo-r42.':'Verifying the exact candidate from Build.',outputs:['test_report'],deps:[{id:'build',artifact:'build',met:buildReady}],artifacts:tested||failed?[{name:'test_report',revision:'demo-r42',content:tested?'Illustrative evidence: all checks passed for demo-r42.':'Illustrative evidence: a regression failed for demo-r42.'}]:[]},
{id:'release',title:'Release',state:tested?'pending':'blocked',summary:tested?'Dependencies satisfied. Ready to claim; nothing has been released.':failed?'Test failed. A report alone does not satisfy a success dependency.':'Waiting for the build and successful verification of the same revision.',outputs:['release_record'],deps:[{id:'build',artifact:'build',met:buildReady},{id:'test',artifact:'test_report',met:tested}],artifacts:[]}
];}
function live(){return snapshot.tasks.map(t=>({id:String(t.id),title:'#'+t.id+' · '+t.title,state:t.workflow?.outcome==='failed'?'failed':t.status==='completed'?'success':t.status==='in_progress'?'working':t.status,summary:t.completion_message||t.body||'No summary provided.',outputs:t.workflow?.required_outputs||[],artifacts:t.workflow?.artifacts||[],deps:(t.blocked_by||[]).map(d=>{const upstream=snapshot.tasks.find(x=>x.id===d.task_id),outcome=upstream?.workflow?.outcome,condition=d.condition||'success';return{id:String(d.task_id),condition,artifact:(d.required_artifacts||[]).join(', ')||'completion result',met:!!upstream&&(condition==='success'?outcome==='success':condition==='failure'?outcome==='failed':['completed','cancelled'].includes(upstream.status))&&(d.required_artifacts||[]).every(n=>upstream.workflow?.artifacts?.some(a=>a.name===n))};})}));}
const labels={success:'Succeeded',failed:'Failed',blocked:'Blocked',working:'In progress',pending:'Ready',draft:'Draft',cancelled:'Cancelled'};

$('detail').innerHTML='<h2>'+esc(t.title)+'</h2><p>'+esc(t.summary)+'</p><h3>Prerequisites — all required</h3>'+(t.deps.length?'<ul>'+t.deps.map(d=>'<li><span class="'+(d.met?'success':'blocked')+'">'+(d.met?'Satisfied':'Waiting')+'</span> · '+esc(d.id)+' must meet '+esc(d.condition||'success')+' with <code>'+esc(d.artifact)+'</code></li>').join('')+'</ul>':'<p>No prerequisites.</p>')+'<h3>Required outputs</h3><p>'+esc(t.outputs.length?t.outputs.join(', '):'No named outputs declared.')+'</p><h3>Published evidence</h3>'+(t.artifacts.length?t.artifacts.map(a=>'<div class="artifact"><strong>'+esc(a.name)+'</strong><small>Revision: <code>'+esc(a.revision||'not supplied')+'</code></small>'+(a.uri?'<small>'+esc(a.uri)+'</small>':'')+(a.digest?'<small>Digest: '+esc(a.digest)+'</small>':'')+(a.content?'<details><summary>Read evidence</summary><pre>'+esc(a.content)+'</pre></details>':'')+'</div>').join(''):'<p>No artifacts published yet.</p>')+(mode==='demo'&&$('scenario').value==='failed'?'<div class="notice">Rework needs a new task linked with retry_of. Reconnect unstarted downstream tasks to the new result; keep completed evidence immutable.</div>':'');
$('status').textContent='';}
$('scenario').onchange=render;$('demo-tab').onclick=()=>{mode='demo';selected='release';render();};$('live-tab').onclick=()=>{mode='live';selected='663';render();};
$('ask').onclick=async()=>{const request={mode,task_id:selected,scenario:mode==='demo'?$('scenario').value:null,board:mode==='live'?snapshot.board:null,observed_at:mode==='live'?snapshot.observed_at:null};$('ask').disabled=true;try{const r=await coralUI.emit('inspect-workflow-task',request);$('status').textContent=r.notified?'Question saved; agent notified.':'Question saved for the agent to read.';}catch(e){$('status').textContent=e.message;}finally{$('ask').disabled=false;}};
render();
})();
</script>
