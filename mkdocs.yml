site_name: Coral docs
site_description: "Documentation for Coral: coding agents and agent teams in one dashboard"
site_url: https://subgentic.github.io/coral/
repo_url: https://github.com/subgentic/coral
repo_name: subgentic/coral
edit_uri: edit/main/coral-go/site_docs/
docs_dir: coral-go/site_docs
use_directory_urls: true

theme:
  name: material
  custom_dir: coral-go/docs_theme
  logo: assets/coral-icon.png
  favicon: assets/favicon.png
  font: false
  palette:
    # Dark by default (the coralhub.dev look); the second entry is the matching light scheme.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - redirects:
      redirect_maps:
        multi-agent-orchestration.md: teams-and-tasks.md
        agent-teams-message-board.md: teams-and-tasks.md
        live-sessions.md: getting-started.md
        git-integration.md: teams-and-tasks.md
        button-macros.md: reference.md
        protocol.md: reference.md
        session-history-search.md: reference.md
        metrics-observability.md: privacy.md
        scheduled-jobs.md: teams-and-tasks.md
        one-time-jobs.md: teams-and-tasks.md
        webhooks.md: reference.md
        themes-customization.md: reference.md
        api/jobs.md: reference.md
        api/webhooks.md: reference.md

# The !!! note and !!! warning callouts in the guides (multi-server-hub.md).
markdown_extensions:
  - admonition

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Using the dashboard: using-the-dashboard.md
  - Teams and tasks: teams-and-tasks.md
  - Files and artifacts: files-and-artifacts.md
  - Agent UI: agent-ui.md
  - Remote access: remote-access.md
  - Multi-server hub: multi-server-hub.md
  - Privacy: privacy.md
  - Troubleshooting: troubleshooting.md
  - Reference: reference.md
