# The bundled tmux payload for one macOS architecture (#4126 item 1): restored from the cache when
# its inputs are unchanged, built from source otherwise; checked the same way either way.
#
# The cache key is the build script, the pinned sources (bundled-tmux-sources.tsv holds each
# source's version, URL and sha256), the architecture, the runner image and the macOS SDK.
# Only the main branch writes it (release-cache-warm.yml, save: "true"): a cache saved on a tag
# can't be read by any other tag, and a ci/ branch's cache is never visible to tags, so what a
# release restores was built by a main run of this same action. The release restores and never
# saves (Security's #4126 conditions).
#
# On a restore the manifest saved with the payload (every file's sha256) must carry a build
# provenance attestation signed by release-cache-warm.yml on the expected ref (main for a release),
# so who built it rests on GitHub's attestation, not on the cache store (Security's SHOULD on
# #4251); then every file is checked against it, and the restored tmux's version and sha256 go into
# the build log. A restore whose attestation does not verify is thrown away and the payload is built
# from source, with a warning. Built or restored, the payload then passes
# verify_bundled_tmux_slice.sh, and the job runs the bundled-tmux smoke test after.
#
# The warm job attests the manifest when it builds one: it needs id-token: write and
# attestations: write.
name: Bundled tmux payload (cached from main)
description: Restores or builds tools/build-bundled-tmux.sh's payload, then verifies it.
inputs:
  arch:
    description: arm64 or x86_64
    required: true
  out:
    description: The payload folder (dist/macos-<arch>/tmux-payload)
    required: true
  save:
    description: '"true" on main only (release-cache-warm.yml): save the payload when it was built'
    required: false
    default: "false"
  attested-ref:
    description: The ref whose release-cache-warm.yml run must have attested a restored payload
    required: false
    default: refs/heads/main
outputs:
  cache-hit:
    description: '"true" when the payload was restored from the cache and its attestation verified'
    value: ${{ steps.attested.outputs.ok }}
runs:
  using: composite
  steps:
    - name: Cache key (tmux ${{ inputs.arch }})
      id: key
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        INPUTS_HASH: ${{ hashFiles('tools/build-bundled-tmux.sh', 'tools/bundled-tmux-sources.tsv') }}
      run: |
        set -euo pipefail
        sdk="$(xcrun --show-sdk-version)"
        echo "key=bundled-tmux-v2-${ARCH}-${ImageOS:-unknown}-sdk${sdk}-${INPUTS_HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore the tmux payload (${{ inputs.arch }})
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.out }}
          ${{ inputs.out }}.sha256
        key: ${{ steps.key.outputs.key }}

    - name: Verify the restored payload's attestation (${{ inputs.arch }})
      id: attested
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        GH_TOKEN: ${{ github.token }}
        REF: ${{ inputs.attested-ref }}
      run: |
        set -euo pipefail
        if test -s "$OUT.sha256" && gh attestation verify "$OUT.sha256" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-cache-warm.yml" --source-ref "$REF"; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::the cached tmux payload's attestation did not verify; building it from source"
          rm -rf -- "$OUT" "$OUT.sha256"
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Check the restored payload (${{ inputs.arch }})
      if: steps.attested.outputs.ok == 'true'
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        test -s "$OUT.sha256" || { echo "::error::restored tmux payload has no manifest"; exit 1; }
        # Every file listed, and every file listed matches; nothing extra.
        (cd "$OUT" && shasum -a 256 -c "../$(basename "$OUT").sha256" >/dev/null)
        listed="$(awk '{ print $2 }' "$OUT.sha256" | sort)"
        present="$(cd "$OUT" && find . -type f | sort)"
        [ "$listed" = "$present" ] || { echo "::error::restored tmux payload differs from its manifest"; exit 1; }
        echo "Restored bundled tmux: $("$OUT/bin/tmux" -V), sha256 $(shasum -a 256 "$OUT/bin/tmux" | cut -d ' ' -f 1)"

    - name: Build bundled tmux (${{ inputs.arch }})
      if: steps.attested.outputs.ok != 'true'
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        tools/build-bundled-tmux.sh "$ARCH" "$OUT"
        (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256) > "$OUT.sha256"
        echo "Built bundled tmux: $("$OUT/bin/tmux" -V), sha256 $(shasum -a 256 "$OUT/bin/tmux" | cut -d ' ' -f 1)"

    - name: Verify the tmux slice (${{ inputs.arch }})
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        OUT: ${{ inputs.out }}
      run: tests/release/verify_bundled_tmux_slice.sh "$OUT" "$ARCH"

    - name: Attest the payload's manifest (${{ inputs.arch }})
      if: inputs.save == 'true' && steps.attested.outputs.ok != 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ inputs.out }}.sha256

    - name: Save the tmux payload (${{ inputs.arch }}, main only)
      if: inputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.out }}
          ${{ inputs.out }}.sha256
        key: ${{ steps.key.outputs.key }}
