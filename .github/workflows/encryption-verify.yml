            install_name_tool -change "$RUNNER_TEMP/openssl-$OPENSSL_VERSION-amd64/lib/libcrypto.3.dylib" '@rpath/libcrypto.3.dylib' "$binary" || true
            install_name_tool -change "/usr/local/opt/openssl@3/lib/libcrypto.3.dylib" '@rpath/libcrypto.3.dylib' "$binary" || true
