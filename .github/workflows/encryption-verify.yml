name: Encryption package verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "coral-go/**"
      - "tests/release/**"
      - "licenses/**"
      - "THIRD_PARTY_NOTICES_SQLCIPHER.md"
      - ".github/workflows/encryption-verify.yml"

permissions:
  contents: read

# This workflow is deliberately unsigned and never uploads or publishes an
# artifact. It records the exact native library selected by each ephemeral
# runner before running the extracted-package verifier.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: coral-go/go.sum
      - name: Install isolated native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev patchelf
      - name: Build and verify extracted Linux package
        working-directory: coral-go
        run: |
          set -euo pipefail
          mkdir -p ../dist/encryption-linux
          for cmd in coral launch-coral coral-board coral-agent coral-hook-agentic-state coral-hook-message-check coral-hook-session-start coral-hook-task-sync; do
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags fts5 -o "../dist/encryption-linux/$cmd" "./cmd/$cmd/"
          done
          SOURCE_LIB="$(ldconfig -p | awk '/libcrypto\.so\.3/{print $NF; exit}')"
          cp "$SOURCE_LIB" ../dist/encryption-linux/libcrypto.so.3
          cp ../THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-linux/
          cp -R ../licenses ../dist/encryption-linux/
          for binary in ../dist/encryption-linux/coral* ../dist/encryption-linux/launch-coral; do patchelf --set-rpath '$ORIGIN' "$binary"; done
          openssl version -a
          sha256sum ../dist/encryption-linux/libcrypto.so.3
          LIB="../dist/encryption-linux/libcrypto.so.3"
          HASH="$(sha256sum "$LIB" | awk '{print $1}')"
          PKG="$(dpkg-query -S "$(readlink -f "$SOURCE_LIB")" 2>/dev/null | cut -d: -f1 | sed 's/:amd64$//' || true)"
          VER=""
          if [ -n "$PKG" ]; then VER="$(dpkg-query -W -f='${Version}' "$PKG" 2>/dev/null || true)"; fi
          printf 'platform=linux\nvendor=ubuntu\npackage=%s\nversion=%s\nlibrary_sha256=%s\n' "$PKG" "$VER" "$HASH" > ../dist/encryption-linux/openssl-attestation.env
          ../tests/release/verify_openssl_attestation.sh ../dist/encryption-linux/openssl-attestation.env "$LIB"
          ../tests/release/verify_encrypted_bundle.sh ../dist/encryption-linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: coral-go/go.sum
      - name: Install isolated native dependencies
        shell: powershell
        run: choco install mingw openssl -y
      - name: Build and verify extracted Windows package
        working-directory: coral-go
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CGO_ENABLED = "1"
          $env:CGO_CFLAGS = "-IC:/PROGRA~1/OpenSSL/include"
          $opensslRoot = "C:\Program Files\OpenSSL"
          $opensslImport = Get-ChildItem "$opensslRoot\lib" -Filter libcrypto.lib -Recurse | Select-Object -First 1
          if ($null -eq $opensslImport) { throw "OpenSSL import library not found" }
          $opensslLibDir = $opensslImport.DirectoryName.Replace('\', '/').Replace('C:/Program Files', 'C:/PROGRA~1')
          $env:CGO_LDFLAGS = "-L$opensslLibDir -l:libcrypto.lib"
          New-Item -ItemType Directory -Force -Path ..\dist\encryption-windows | Out-Null
          foreach ($cmd in @("coral", "launch-coral", "coral-board", "coral-agent", "coral-hook-agentic-state", "coral-hook-message-check", "coral-hook-session-start", "coral-hook-task-sync")) {
            go build -tags fts5 -o "..\dist\encryption-windows\$cmd.exe" "./cmd/$cmd/"
          }
          go build -tags fts5 -ldflags "-H windowsgui" -o ..\dist\encryption-windows\coral-tray.exe ./cmd/coral-tray/
          go build -tags webview,fts5 -ldflags "-H windowsgui" -o ..\dist\encryption-windows\coral-app.exe ./cmd/coral-app/
          Copy-Item "$opensslRoot\bin\libcrypto-3-x64.dll" ..\dist\encryption-windows\
          Copy-Item ..\THIRD_PARTY_NOTICES_SQLCIPHER.md ..\dist\encryption-windows\
          Copy-Item ..\licenses ..\dist\encryption-windows\licenses -Recurse
          & "$opensslRoot\bin\openssl.exe" version -a
          (Get-FileHash ..\dist\encryption-windows\libcrypto-3-x64.dll -Algorithm SHA256).Hash
          # Hash with the same MSYS utility used by the shared Bash verifier;
          # PowerShell and MSYS can disagree on binary path handling.
          $libraryPath = (Resolve-Path ..\dist\encryption-windows\libcrypto-3-x64.dll).Path.Replace('\', '/')
          $hash = ((bash -c "sha256sum '$libraryPath'") -split '\s+')[0].Trim().ToLower()
          $version = (& "$opensslRoot\bin\openssl.exe" version | Select-Object -First 1) -replace '^OpenSSL\s+', '' -replace '\s.*$', ''
          $attestation = "platform=windows`nvendor=chocolatey`npackage=openssl`nversion=$version`nlibrary_sha256=$hash"
          # Windows PowerShell's default Set-Content encoding is UTF-16LE;
          # write UTF-8 without a BOM so the shared POSIX verifier reads the
          # exact fields and hash emitted above.
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path ..\dist\encryption-windows) "openssl-attestation.env"), $attestation, (New-Object System.Text.UTF8Encoding($false)))
          bash ..\tests\release\verify_openssl_attestation.sh ..\dist\encryption-windows\openssl-attestation.env ..\dist\encryption-windows\libcrypto-3-x64.dll
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL policy rejected the copied library" }
          powershell -ExecutionPolicy Bypass -File ..\tests\release\verify_encrypted_bundle.ps1 -PackageDir ..\dist\encryption-windows

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: coral-go/go.sum
      - name: Install isolated native dependencies
        run: brew install openssl@3
      - name: Build arm64 package slices
        working-directory: coral-go
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          mkdir -p ../dist/encryption-macos-arm64
          for cmd in coral launch-coral coral-board coral-agent coral-hook-agentic-state coral-hook-message-check coral-hook-session-start coral-hook-task-sync; do
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=arm64 go build -tags fts5 -o "../dist/encryption-macos-arm64/$cmd" "./cmd/$cmd/"
          done
          for cmd in coral-tray coral-app; do
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=arm64 go build -tags webview,fts5 -o "../dist/encryption-macos-arm64/$cmd" "./cmd/$cmd/"
          done
          cp "${OPENSSL_PREFIX}/lib/libcrypto.3.dylib" ../dist/encryption-macos-arm64/
          "${OPENSSL_PREFIX}/bin/openssl" version | awk '{print $2}' > ../dist/encryption-macos-arm64/openssl-version
          cp ../THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-macos-arm64/
          cp -R ../licenses ../dist/encryption-macos-arm64/
      - uses: actions/upload-artifact@v7
        with:
          name: encryption-macos-arm64
          path: dist/encryption-macos-arm64

  macos-amd64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: coral-go/go.sum
      - name: Install isolated native dependencies
        run: brew install openssl@3
      - name: Build amd64 package slices
        working-directory: coral-go
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          mkdir -p ../dist/encryption-macos-amd64
          for cmd in coral launch-coral coral-board coral-agent coral-hook-agentic-state coral-hook-message-check coral-hook-session-start coral-hook-task-sync; do
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=amd64 go build -tags fts5 -o "../dist/encryption-macos-amd64/$cmd" "./cmd/$cmd/"
          done
          for cmd in coral-tray coral-app; do
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=amd64 go build -tags webview,fts5 -o "../dist/encryption-macos-amd64/$cmd" "./cmd/$cmd/"
          done
          cp "${OPENSSL_PREFIX}/lib/libcrypto.3.dylib" ../dist/encryption-macos-amd64/
          "${OPENSSL_PREFIX}/bin/openssl" version | awk '{print $2}' > ../dist/encryption-macos-amd64/openssl-version
          cp ../THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-macos-amd64/
          cp -R ../licenses ../dist/encryption-macos-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: encryption-macos-amd64
          path: dist/encryption-macos-amd64

  macos:
    needs: [macos-arm64, macos-amd64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: coral-go/go.sum
      - name: Install merge and verification dependencies
        run: brew install openssl@3
      - uses: actions/download-artifact@v8
        with:
          name: encryption-macos-arm64
          path: dist/encryption-macos-arm64
      - uses: actions/download-artifact@v8
        with:
          name: encryption-macos-amd64
          path: dist/encryption-macos-amd64
      - name: Merge and verify universal package
        working-directory: coral-go
        run: |
          set -euo pipefail
          ARM_OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          mkdir -p ../dist/encryption-macos
          for cmd in coral launch-coral coral-board coral-agent coral-hook-agentic-state coral-hook-message-check coral-hook-session-start coral-hook-task-sync coral-tray coral-app; do
            lipo -create -output "../dist/encryption-macos/$cmd" "../dist/encryption-macos-arm64/$cmd" "../dist/encryption-macos-amd64/$cmd"
          done
          lipo -create -output ../dist/encryption-macos/libcrypto.3.dylib ../dist/encryption-macos-arm64/libcrypto.3.dylib ../dist/encryption-macos-amd64/libcrypto.3.dylib
          cp ../dist/encryption-macos-arm64/THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-macos/
          cp -R ../dist/encryption-macos-arm64/licenses ../dist/encryption-macos/
          for binary in ../dist/encryption-macos/*; do
            [ -f "$binary" ] || continue
            install_name_tool -change "${ARM_OPENSSL_PREFIX}/lib/libcrypto.3.dylib" '@rpath/libcrypto.3.dylib' "$binary" || true
            install_name_tool -change "/usr/local/opt/openssl@3/lib/libcrypto.3.dylib" '@rpath/libcrypto.3.dylib' "$binary" || true
            install_name_tool -add_rpath '@loader_path' "$binary" || true
          done
          ARM_VERSION="$(cat ../dist/encryption-macos-arm64/openssl-version)"
          X86_VERSION="$(cat ../dist/encryption-macos-amd64/openssl-version)"
          COMBINED_HASH="$(shasum -a 256 ../dist/encryption-macos/libcrypto.3.dylib | awk '{print $1}')"
          ARM_HASH="$(shasum -a 256 ../dist/encryption-macos-arm64/libcrypto.3.dylib | awk '{print $1}')"
          X86_HASH="$(shasum -a 256 ../dist/encryption-macos-amd64/libcrypto.3.dylib | awk '{print $1}')"
          printf 'platform=macos\nvendor=homebrew\npackage=openssl@3\nversion=%s\nslice_arm64_version=%s\nslice_x86_64_version=%s\nlibrary_sha256=%s\nslice_arm64_sha256=%s\nslice_x86_64_sha256=%s\ncombined_sha256=%s\n' "$ARM_VERSION" "$ARM_VERSION" "$X86_VERSION" "$COMBINED_HASH" "$ARM_HASH" "$X86_HASH" "$COMBINED_HASH" > ../dist/encryption-macos/openssl-attestation.env
          ../tests/release/verify_openssl_attestation.sh ../dist/encryption-macos/openssl-attestation.env ../dist/encryption-macos/libcrypto.3.dylib ../dist/encryption-macos-arm64/libcrypto.3.dylib ../dist/encryption-macos-amd64/libcrypto.3.dylib
          OPENSSL_PREFIX="$ARM_OPENSSL_PREFIX" ../tests/release/verify_encrypted_bundle.sh ../dist/encryption-macos
