name: Encryption package verification

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build: all, or any of linux windows macos (space-separated)"
        default: all
  # A push to main runs it for the files an encrypted build depends on (the team lands on main,
  # so pull requests alone left main uncovered), and warms the macOS OpenSSL cache.
  push:
    branches: [main]
    paths:
      - "coral-go/go.mod"
      - "coral-go/go.sum"
      - "coral-go/cmd/**"
      - "coral-go/internal/dbcrypt/**"
      - "coral-go/internal/store/**"
      - "coral-go/internal/board/**"
      - "coral-go/internal/startup/**"
      - "tests/release/**"
      - "licenses/**"
      - "THIRD_PARTY_NOTICES_SQLCIPHER.md"
      - ".github/workflows/encryption-verify.yml"
  pull_request:
    paths:
      - "coral-go/**"
      - "tests/release/**"
      - "licenses/**"
      - "THIRD_PARTY_NOTICES_SQLCIPHER.md"
      - ".github/workflows/encryption-verify.yml"

permissions:
  contents: read

# The macOS OpenSSL build: these values make both the build and its cache key (#4126 item 4, Security's
# note), so a bump to one can't restore a build made from the other. Each macOS job adds its Configure
# target (OPENSSL_TARGET).
env:
  OPENSSL_VERSION: "3.6.5"
  OPENSSL_SHA256: "a2157c2830efdec3788939b00c9b0638306d3f0bbb76dc4832ee503bb397df98"
  OPENSSL_OPTIONS: "shared no-tests"

# This workflow is deliberately unsigned and never uploads or publishes an
# artifact. It records the exact native library selected by each ephemeral
# runner before running the extracted-package verifier.
jobs:
  # Which platforms run (#4126): a dispatch names them; a push or pull request whose changed files
  # are all one platform's (_windows.go and .ps1 files, _darwin.go, _linux.go) runs that platform
  # only; anything else, or a change list that can't be read, runs all three.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.platforms }}
          REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A renamed file counts under both names: foo.go renamed to foo_windows.go leaves the other platforms' builds too.
          all=" linux windows macos "
          plan=""
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$INPUT" ] || [ "$INPUT" = all ]; then plan="$all"; else
              for p in $INPUT; do
                case "$p" in linux|windows|macos) plan="$plan $p" ;; *) echo "::error::unknown platform: $p"; exit 1 ;; esac
              done
              plan="$plan "
            fi
          else
            if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$BEFORE"; head="$SHA"; fi
            files=""
            if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ]; then
              files="$(gh api "repos/$REPO/compare/$base...$head" --jq 'if (.files | length) < 300 then .files[] | .filename, (.previous_filename // empty) else "TOO-MANY" end' || echo UNREADABLE)"
            fi
            if [ -z "$files" ]; then files=UNREADABLE; fi
            while IFS= read -r f; do
              case "$f" in
                *_windows.go|*_windows_test.go|*.ps1|tools/coral.wxs) plan="$plan windows" ;;
                *_darwin.go|*_darwin_test.go) plan="$plan macos" ;;
                *_linux.go|*_linux_test.go) plan="$plan linux" ;;
                *) plan="$all"; break ;;
              esac
            done <<< "$files"
            plan="$plan "
          fi
          echo "platforms:$plan"
          echo "platforms=$plan" >> "$GITHUB_OUTPUT"

  linux:
    needs: [plan]
    if: contains(needs.plan.outputs.platforms, ' linux ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum
      - name: Install isolated native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev patchelf
      - name: Build and verify extracted Linux package
        working-directory: coral-go
        run: |
          set -euo pipefail
          mkdir -p ../dist/encryption-linux
          for cmd in $(grep -vE '^[[:space:]]*(#|$)' ../tests/release/commands.txt); do  # tests/release/commands.txt (#3855)
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags sqlcipher,fts5 -o "../dist/encryption-linux/$cmd" "./cmd/$cmd/"
          done
          SOURCE_LIB="$(ldconfig -p | awk '/libcrypto\.so\.3/{print $NF; exit}')"
          cp "$SOURCE_LIB" ../dist/encryption-linux/libcrypto.so.3
          cp ../THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-linux/
          cp -R ../licenses ../dist/encryption-linux/
          for binary in ../dist/encryption-linux/coral* ../dist/encryption-linux/launch-coral; do patchelf --set-rpath '$ORIGIN' "$binary"; done
          openssl version -a
          sha256sum ../dist/encryption-linux/libcrypto.so.3
          LIB="../dist/encryption-linux/libcrypto.so.3"
          HASH="$(sha256sum "$LIB" | awk '{print $1}')"
          PKG="$(dpkg-query -S "$(readlink -f "$SOURCE_LIB")" 2>/dev/null | cut -d: -f1 | sed 's/:amd64$//' || true)"
          VER=""
          if [ -n "$PKG" ]; then VER="$(dpkg-query -W -f='${Version}' "$PKG" 2>/dev/null || true)"; fi
          printf 'platform=linux\nvendor=ubuntu\npackage=%s\nversion=%s\nlibrary_sha256=%s\n' "$PKG" "$VER" "$HASH" > ../dist/encryption-linux/openssl-attestation.env
          ../tests/release/verify_openssl_attestation.sh ../dist/encryption-linux/openssl-attestation.env "$LIB"
          ../tests/release/verify_encrypted_bundle.sh ../dist/encryption-linux

  windows:
    needs: [plan]
    if: contains(needs.plan.outputs.platforms, ' windows ')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum
      # mingw is pinned. OpenSSL is the runner image's own (C:\Program Files\OpenSSL), not a Chocolatey
      # package: Chocolatey's older openssl packages download from slproweb.com, which drops old
      # installers (3.6.2 already fails), and the image's OpenSSL is 3.6.5, the same as the macOS jobs.
      # The build step asserts the version, so an image update that moves it fails the build on
      # purpose; bump it together with the macOS pin (#4092 follow-up, Security's and Backend's notes).
      - name: Install isolated native dependencies
        shell: powershell
        run: |
          choco install mingw --version=16.1.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install mingw failed" }
      - name: Build and verify extracted Windows package
        working-directory: coral-go
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CGO_ENABLED = "1"
          $env:CGO_CFLAGS = "-IC:/PROGRA~1/OpenSSL/include"
          $opensslRoot = "C:\Program Files\OpenSSL"
          $opensslImport = Get-ChildItem "$opensslRoot\lib" -Filter libcrypto.lib -Recurse | Select-Object -First 1
          if ($null -eq $opensslImport) { throw "OpenSSL import library not found" }
          Write-Host "OpenSSL link library: $($opensslImport.FullName)"
          Get-ChildItem "$opensslRoot\bin" -Filter 'libcrypto*.dll' | ForEach-Object { Write-Host "OpenSSL DLL: $($_.FullName) file-version=$($_.VersionInfo.FileVersion)" }
          $opensslLibDir = $opensslImport.DirectoryName.Replace('\', '/').Replace('C:/Program Files', 'C:/PROGRA~1')
          # The SQLCipher module asks for -lcrypto (#cgo LDFLAGS), and GNU ld finds that only as libcrypto.a,
          # libcrypto.dll.a and the like: OpenSSL for Windows ships an MSVC import library, libcrypto.lib.
          # A copy named libcrypto.a (ld reads MSVC import libraries as archives) in a folder of its own lets
          # every link, the g++ one for coral-app's webview included, resolve it (#4092).
          $cryptoLinkDir = Join-Path $env:RUNNER_TEMP "crypto-link"
          New-Item -ItemType Directory -Force -Path $cryptoLinkDir | Out-Null
          Copy-Item $opensslImport.FullName (Join-Path $cryptoLinkDir "libcrypto.a")
          $env:CGO_LDFLAGS = "-L$($cryptoLinkDir.Replace('\', '/')) -L$opensslLibDir -l:libcrypto.lib"
          New-Item -ItemType Directory -Force -Path ..\dist\encryption-windows | Out-Null
          foreach ($cmd in (Get-Content ..\tests\release\commands.txt | Where-Object { $_ -notmatch '^\s*(#|$)' } | ForEach-Object { $_.Trim() })) {  # tests/release/commands.txt (#3855)
            go build -tags sqlcipher,fts5 -o "..\dist\encryption-windows\$cmd.exe" "./cmd/$cmd/"
            if ($LASTEXITCODE -ne 0) { throw "go build failed: $cmd" }
          }
          # A failed build stops here, not later as a "missing packaged executable" (#4092).
          go build -tags sqlcipher,fts5 -ldflags "-H windowsgui" -o ..\dist\encryption-windows\coral-tray.exe ./cmd/coral-tray/
          if ($LASTEXITCODE -ne 0) { throw "go build failed: coral-tray" }
          go build -tags webview,sqlcipher,fts5 -ldflags "-H windowsgui" -o ..\dist\encryption-windows\coral-app.exe ./cmd/coral-app/
          if ($LASTEXITCODE -ne 0) { throw "go build failed: coral-app" }
          $version = (& "$opensslRoot\bin\openssl.exe" version | Select-Object -First 1) -replace '^OpenSSL\s+', '' -replace '\s.*$', ''
          if ($version -match '^(\d+)\.') { $cryptoMajor = $Matches[1] } else { throw "unrecognized OpenSSL version: $version" }
          # The pin (see the dependencies step): the image's OpenSSL must be exactly 3.6.5, and the link
          # library must be its own, in C:\Program Files\OpenSSL.
          $expectedOpenSSL = $env:OPENSSL_VERSION  # the workflow env, shared with the macOS builds
          if ($version -ne $expectedOpenSSL) { throw "OpenSSL is $version, expected $expectedOpenSSL (the runner image moved it: bump with the macOS pin)" }
          if (-not $opensslImport.FullName.StartsWith("$opensslRoot\")) { throw "OpenSSL link library $($opensslImport.FullName) is not under $opensslRoot" }
          $dllName = "libcrypto-${cryptoMajor}-x64.dll"
          $sourceDll = Join-Path "$opensslRoot\bin" $dllName
          if (!(Test-Path $sourceDll)) { throw "matching OpenSSL DLL not found: $sourceDll" }
          $dllVersion = (Get-Item $sourceDll).VersionInfo.FileVersion
          if ($dllVersion -ne $version) { throw "OpenSSL DLL version $dllVersion differs from CLI version $version" }
          Copy-Item $sourceDll ..\dist\encryption-windows\
          Copy-Item ..\THIRD_PARTY_NOTICES_SQLCIPHER.md ..\dist\encryption-windows\
          Copy-Item ..\licenses ..\dist\encryption-windows\licenses -Recurse
          & "$opensslRoot\bin\openssl.exe" version -a
          (Get-FileHash (Join-Path ..\dist\encryption-windows $dllName) -Algorithm SHA256).Hash
          # Hash and verify the same MSYS path, avoiding different path
          # interpretations between the two Bash invocations.
          $libraryPath = (Resolve-Path (Join-Path ..\dist\encryption-windows $dllName)).Path
          $msysLibraryPath = (& cygpath -u $libraryPath).Trim()
          $hash = ((bash -c "sha256sum '$msysLibraryPath'") -split '\s+')[0].Trim().ToLower()
          $attestation = "platform=windows`nvendor=chocolatey`npackage=openssl`nversion=$version`nlibrary_sha256=$hash"
          # Windows PowerShell's default Set-Content encoding is UTF-16LE;
          # write UTF-8 without a BOM so the shared POSIX verifier reads the
          # exact fields and hash emitted above.
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path ..\dist\encryption-windows) "openssl-attestation.env"), $attestation, (New-Object System.Text.UTF8Encoding($false)))
          $attestationPath = (& cygpath -u (Join-Path (Resolve-Path ..\dist\encryption-windows).Path "openssl-attestation.env")).Trim()
          bash ..\tests\release\verify_openssl_attestation.sh $attestationPath $msysLibraryPath
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL policy rejected the copied library" }
          powershell -ExecutionPolicy Bypass -File ..\tests\release\verify_encrypted_bundle.ps1 -PackageDir ..\dist\encryption-windows

  macos-arm64:
    needs: [plan]
    if: contains(needs.plan.outputs.platforms, ' macos ')
    runs-on: macos-14
    env:
      OPENSSL_TARGET: darwin64-arm64-cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum
      # The OpenSSL build is cached by version, source checksum, Configure target and runner image
      # (#4126 item 4; the Intel build took 316 s, p90 490 s). Only main writes the cache, so a branch,
      # pull request or dispatch from another ref can restore main's build but never write one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: openssl
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}-arm64
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-${{ env.OPENSSL_TARGET }}-${{ env.OPENSSL_OPTIONS }}-macos-14
      - name: Install isolated native dependencies
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-$OPENSSL_VERSION-arm64"
          OPENSSL_TARBALL="$RUNNER_TEMP/openssl-$OPENSSL_VERSION.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz" -o "$OPENSSL_TARBALL"
          echo "$OPENSSL_SHA256  $OPENSSL_TARBALL" | shasum -a 256 -c -
          tar -xzf "$OPENSSL_TARBALL" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          ./Configure "$OPENSSL_TARGET" $OPENSSL_OPTIONS --prefix="$OPENSSL_PREFIX" --openssldir="$OPENSSL_PREFIX/ssl"
          make -j"$(sysctl -n hw.ncpu)" build_sw
          make install_sw
      - if: github.ref == 'refs/heads/main' && steps.openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}-arm64
          key: ${{ steps.openssl.outputs.cache-primary-key }}
      - name: Build arm64 package slices
        working-directory: coral-go
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-$OPENSSL_VERSION-arm64"
          mkdir -p ../dist/encryption-macos-arm64
          for cmd in $(grep -vE '^[[:space:]]*(#|$)' ../tests/release/commands.txt); do  # tests/release/commands.txt (#3855)
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=arm64 go build -tags sqlcipher,fts5 -o "../dist/encryption-macos-arm64/$cmd" "./cmd/$cmd/"
          done
          for cmd in coral-tray coral-app; do
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=arm64 go build -tags webview,sqlcipher,fts5 -o "../dist/encryption-macos-arm64/$cmd" "./cmd/$cmd/"
          done
          cp "${OPENSSL_PREFIX}/lib/libcrypto.3.dylib" ../dist/encryption-macos-arm64/
          "${OPENSSL_PREFIX}/bin/openssl" version | awk '{print $2}' > ../dist/encryption-macos-arm64/openssl-version
          cp ../THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-macos-arm64/
          cp -R ../licenses ../dist/encryption-macos-arm64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encryption-macos-arm64
          path: dist/encryption-macos-arm64

  macos-amd64:
    needs: [plan]
    if: contains(needs.plan.outputs.platforms, ' macos ')
    runs-on: macos-15-intel
    env:
      OPENSSL_TARGET: darwin64-x86_64-cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum
      # The OpenSSL build is cached by version, source checksum, Configure target and runner image
      # (#4126 item 4; the Intel build took 316 s, p90 490 s). Only main writes the cache, so a branch,
      # pull request or dispatch from another ref can restore main's build but never write one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: openssl
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}-amd64
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-${{ env.OPENSSL_TARGET }}-${{ env.OPENSSL_OPTIONS }}-macos-15-intel
      - name: Install isolated native dependencies
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-$OPENSSL_VERSION-amd64"
          OPENSSL_TARBALL="$RUNNER_TEMP/openssl-$OPENSSL_VERSION.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz" -o "$OPENSSL_TARBALL"
          echo "$OPENSSL_SHA256  $OPENSSL_TARBALL" | shasum -a 256 -c -
          tar -xzf "$OPENSSL_TARBALL" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          ./Configure "$OPENSSL_TARGET" $OPENSSL_OPTIONS --prefix="$OPENSSL_PREFIX" --openssldir="$OPENSSL_PREFIX/ssl"
          make -j"$(sysctl -n hw.ncpu)" build_sw
          make install_sw
      - if: github.ref == 'refs/heads/main' && steps.openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}-amd64
          key: ${{ steps.openssl.outputs.cache-primary-key }}
      - name: Build amd64 package slices
        working-directory: coral-go
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-$OPENSSL_VERSION-amd64"
          mkdir -p ../dist/encryption-macos-amd64
          for cmd in $(grep -vE '^[[:space:]]*(#|$)' ../tests/release/commands.txt); do  # tests/release/commands.txt (#3855)
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=amd64 go build -tags sqlcipher,fts5 -o "../dist/encryption-macos-amd64/$cmd" "./cmd/$cmd/"
          done
          for cmd in coral-tray coral-app; do
            CGO_ENABLED=1 CGO_CFLAGS="-I${OPENSSL_PREFIX}/include" CGO_LDFLAGS="-L${OPENSSL_PREFIX}/lib" GOOS=darwin GOARCH=amd64 go build -tags webview,sqlcipher,fts5 -o "../dist/encryption-macos-amd64/$cmd" "./cmd/$cmd/"
          done
          cp "${OPENSSL_PREFIX}/lib/libcrypto.3.dylib" ../dist/encryption-macos-amd64/
          "${OPENSSL_PREFIX}/bin/openssl" version | awk '{print $2}' > ../dist/encryption-macos-amd64/openssl-version
          cp ../THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-macos-amd64/
          cp -R ../licenses ../dist/encryption-macos-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encryption-macos-amd64
          path: dist/encryption-macos-amd64

  macos:
    needs: [macos-arm64, macos-amd64]
    runs-on: macos-14
    env:
      OPENSSL_TARGET: darwin64-arm64-cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum
      # The OpenSSL build is cached by version, source checksum, Configure target and runner image
      # (#4126 item 4; the Intel build took 316 s, p90 490 s). Only main writes the cache, so a branch,
      # pull request or dispatch from another ref can restore main's build but never write one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: openssl
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}-arm64
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-${{ env.OPENSSL_TARGET }}-${{ env.OPENSSL_OPTIONS }}-macos-14
      - name: Install merge and verification dependencies
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-$OPENSSL_VERSION-arm64"
          OPENSSL_TARBALL="$RUNNER_TEMP/openssl-$OPENSSL_VERSION.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz" -o "$OPENSSL_TARBALL"
          echo "$OPENSSL_SHA256  $OPENSSL_TARBALL" | shasum -a 256 -c -
          tar -xzf "$OPENSSL_TARBALL" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          ./Configure "$OPENSSL_TARGET" $OPENSSL_OPTIONS --prefix="$OPENSSL_PREFIX" --openssldir="$OPENSSL_PREFIX/ssl"
          make -j"$(sysctl -n hw.ncpu)" build_sw
          make install_sw
      - if: github.ref == 'refs/heads/main' && steps.openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}-arm64
          key: ${{ steps.openssl.outputs.cache-primary-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: encryption-macos-arm64
          path: dist/encryption-macos-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: encryption-macos-amd64
          path: dist/encryption-macos-amd64
      - name: Merge and verify universal package
        working-directory: coral-go
        run: |
          set -euo pipefail
          ARM_OPENSSL_PREFIX="$RUNNER_TEMP/openssl-$OPENSSL_VERSION-arm64"
          mkdir -p ../dist/encryption-macos
          for cmd in $(grep -hvE '^[[:space:]]*(#|$)' ../tests/release/commands.txt ../tests/release/gui_commands.txt); do  # commands.txt and gui_commands.txt (#3855)
            lipo -create -output "../dist/encryption-macos/$cmd" "../dist/encryption-macos-arm64/$cmd" "../dist/encryption-macos-amd64/$cmd"
            chmod +x "../dist/encryption-macos/$cmd"
          done
          lipo -create -output ../dist/encryption-macos/libcrypto.3.dylib ../dist/encryption-macos-arm64/libcrypto.3.dylib ../dist/encryption-macos-amd64/libcrypto.3.dylib
          cp ../dist/encryption-macos-arm64/THIRD_PARTY_NOTICES_SQLCIPHER.md ../dist/encryption-macos/
          cp -R ../dist/encryption-macos-arm64/licenses ../dist/encryption-macos/
          for cmd in $(grep -hvE '^[[:space:]]*(#|$)' ../tests/release/commands.txt ../tests/release/gui_commands.txt); do  # commands.txt and gui_commands.txt (#3855)
