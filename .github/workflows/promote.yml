name: Promote

# The promotion the self-updater installs from (#326, the operator's decision): a promote.json signed by THIS file on main, which the updater pins
# (coral-go/internal/updater/verify/pins.go: .github/workflows/promote.yml @ refs/heads/main, trigger workflow_dispatch, this repository's id).
# The file's path, the branch and the trigger are part of that trust: a schedule or a push trigger would sign under an identity the updater refuses
# (a test holds this file to one trigger and to the environment on every job that can sign or write).
#
# Run by the operator from the browser (Actions > Promote > Run workflow), after Approve release has made the tag the latest release:
#   promote   a newly approved latest release
#   refresh   the same tag again: a new expiry (a manifest lives 30 days; the updater allows 60) and the next sequence. At least monthly.
#   revoke    after Approve release's revoke: the release it put back as latest, with the bad version in revoked
#   backfill  an older approved version's manifest, published only as promote-v<version> for the Windows rollback
# Every run waits for the operator's approval in the environment "promote" before anything is signed. Team rule: no agent dispatches it.
#
# Where it goes: the product releases are immutable, so each promotion is a release of its own (tools/devops/promote.sh): promote-<sequence>
# and, the first time a version is promoted, promote-v<version>; pre-releases, never marked latest. The sums and the packages stay in the
# product release v<version>, which the manifest names.
#
# Jobs: verify (read only: the release is approved, its sums verified against release.yml's identity, the previous promotion verified; the
# verified files are uploaded before any release code runs), verify-release (read only: the release's programs, pass or fail), build (read only:
# promote.json from verified data), promote (environment promote: the only job with an OIDC token or write access; checks, signs, publishes).
# The inputs are data: they go through env, are matched in tools/devops/promote.sh before any use, and never appear inside a run: script.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "promote, refresh, revoke or backfill"
        required: true
        type: choice
        default: promote
        options: [promote, refresh, revoke, backfill]
      tag:
        description: "The product release tag, a plain vX.Y.Z"
        required: true
        type: string
      revoke:
        description: "revoke only: the versions to revoke, plain X.Y.Z separated by spaces"
        required: false
        type: string
        default: ""

permissions: {}

env:
  CORAL_TELEMETRY_DISABLED: "1"   # verify-release runs the release's own programs: none may send a usage event

concurrency:
  group: promote   # one at a time: the sequence is the next free name above the previous promotion
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      - name: Check the inputs
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          REVOKE: ${{ inputs.revoke }}
        run: bash tools/devops/promote.sh inputs
      - name: Check the release is approved
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          REVOKE: ${{ inputs.revoke }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/devops/promote.sh release
      - name: Verify the sums file against release.yml's identity for this tag and its commit
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/devops/promote.sh sums
      - name: Find and verify the previous promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/devops/promote.sh previous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified
          path: work/
          if-no-files-found: error
          retention-days: 7

  verify-release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      # The same full check as Approve release's verify job. It runs the release's programs, so this job returns pass or fail and nothing else.
      - name: Verify the published release (checksums, signatures, programs)
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/verify-release.sh "$TAG" --stage approved --require-cosign --published

  build:
    needs: [verify, verify-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified
          path: work
      - name: Build promote.json
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          REVOKE: ${{ inputs.revoke }}
        run: |
          set -euo pipefail
          prev=""; [ -f work/previous/promote.json ] && prev=work/previous/promote.json
          # NOW and LIFETIME_DAYS are for the tests only: never taken from the runner's environment here.
          env -u NOW -u LIFETIME_DAYS SOURCE_SHA="$(cat work/source_sha)" SUMS_FILE=work/SHA256SUMS.txt PREV_MANIFEST="$prev" \
            TAKEN="$(tr '\n' ' ' < work/previous/taken)" python3 -I tools/devops/promote_manifest.py > promote.json
          cat promote.json; echo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: promote.json
          if-no-files-found: error
          retention-days: 7

  promote:
    needs: build
    runs-on: ubuntu-24.04
    environment: promote   # required reviewer: the operator; deployment branches: main. Nothing is signed before the approval.
    permissions:
      id-token: write   # the keyless signing certificate for this workflow's identity
      contents: write   # the promote-* releases (gh release create/edit), nothing else
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified
          path: work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      - name: Check the manifest before signing
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/devops/promote.sh check
      - name: Sign promote.json (keyless, this workflow's identity)
        run: cosign sign-blob --yes --bundle promote.json.sigstore.json promote.json
      - name: Publish the promotion (checked against the pinned identity first; Latest must not move)
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/devops/promote.sh publish
