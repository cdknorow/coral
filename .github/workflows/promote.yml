name: Promote release

# THIS COPY ON MAIN IS NEVER THE PINNED ONE. The updater pins this file at refs/heads/promote; the copy here exists so the real bytes are tested on every release
# run and so workflow_dispatch can find the file. A dispatch of this copy gets the certificate ref refs/heads/main (the client refuses it), and its promote job cannot
# start at all: the release-promote environment deploys from promote only, so it has no seed. The copy on refs/heads/promote must be byte-identical to this one whenever it
# is changed (tools/devops/promote-copy-check.sh), because two copies drift.
# Promotes a published release: signs promote.json, the manifest Coral's updater checks, and publishes it with its Sigstore bundle as a release of its own, promote-<tag>-<sequence> (#6274, #6394: this repository's releases are immutable, so a promotion cannot be added to the product release).
# Run by the release owner from the browser (Actions > Promote release > Run workflow). Team rule: no agent dispatches this workflow.
#
# The updater's client pins this file at this ref: .github/workflows/promote.yml on refs/heads/promote of this repository, trigger workflow_dispatch. The file
# and everything it runs (tools/release_code.py, tools/promote_manifest.py) live on the protected promote branch, so one rule protects them all.
#
# Two jobs, one per privilege. validate: read only, no environment, no secrets: it reads the release and checks what release.yml signed. promote: the
# release-promote environment (its reviewer approves first), the only job with id-token: write and contents: write. Its first steps mask the release code, check
# out THIS ref (never main), and verify the code; only then does anything sign or upload. The inputs are data: they go through env, never into script text.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to promote (a plain vX.Y.Z; a release that is still a pre-release is signed as one, which the client refuses: that is the rehearsal)"
        required: true
        type: string
      code:
        description: "The release code (six digits)"
        required: true
        type: string
      lifetime_days:
        description: "How many days the promotion is valid (1 to 59)"
        required: false
        default: "30"
        type: string
      revoke:
        description: "Versions to revoke with this promotion (comma separated, at most 20). A revocation cannot be undone on a Coral that has seen it: a mistaken revoke is fixed by promoting a new version"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Validate the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # a hung step must not hold the promote concurrency group (a third queued dispatch displaces the pending second one)
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      sums_sha256: ${{ steps.release.outputs.sums_sha256 }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the inputs
        env:
          PROMOTE_TAG: ${{ inputs.tag }}
          PROMOTE_LIFETIME_DAYS: ${{ inputs.lifetime_days }}
          PROMOTE_REVOKE: ${{ inputs.revoke }}
        run: python3 -I tools/promote_manifest.py check
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      - name: Read the release and check what release.yml signed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rel="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PROMOTE_TAG}")"
          [ "$(jq -r .draft <<<"$rel")" = false ] || { echo "the release is a draft"; exit 1; }
          [ "$(jq -r .tag_name <<<"$rel")" = "${PROMOTE_TAG}" ] || { echo "the release is not for this tag"; exit 1; }
          prerelease="$(jq -r .prerelease <<<"$rel")"
          # A promotion never points at a release that could still change: the repository's immutable releases make the published assets and the tag final.
          [ "$(jq -r .immutable <<<"$rel")" = true ] || { echo "the release is not immutable"; exit 1; }
          # A release marked revoked (approve-release.sh's "Revoked: <UTC> by <actor>" line in its body) is never promoted again (Security's #337).
          body="$(jq -r '.body // ""' <<<"$rel")"
          if grep -q '^Revoked: ' <<<"$body"; then echo "the release is marked revoked"; exit 1; fi
          # The commit the tag points at, from the tag's own ref, never from an input: git/ref is an exact match (commits/<name> would also take a branch of that
          # name), and an annotated tag is peeled to its commit (Security's #337).
          obj="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${PROMOTE_TAG}" --jq '.object.type + " " + .object.sha')"
          for _ in 1 2 3 4; do
            read -r type sha <<<"$obj"
            [ "$type" = tag ] && [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || break
            obj="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.type + " " + .object.sha')"
          done
          [ "$type" = commit ] && [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "the tag's commit could not be read"; exit 1; }
          gh release download "${PROMOTE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS.txt --pattern SHA256SUMS.txt.sigstore.json --dir sums
          # Only what release.yml signed at this tag, from this commit, by a tag push, is promoted: the exact identity, not a pattern.
          cosign verify-blob sums/SHA256SUMS.txt --bundle sums/SHA256SUMS.txt.sigstore.json \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${PROMOTE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref "refs/tags/${PROMOTE_TAG}" \
            --certificate-github-workflow-sha "${sha}" \
            --certificate-github-workflow-trigger push
          digest="$(sha256sum sums/SHA256SUMS.txt | cut -d' ' -f1)"
          {
            echo "source_sha=${sha}"
            echo "sums_sha256=${digest}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "validated ${PROMOTE_TAG}: commit ${sha}, sums ${digest}, prerelease ${prerelease}"

  promote:
    name: Promote
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-promote   # the reviewer approves first; the code seed is this environment's secret; deployment branch: promote only
    permissions:
      id-token: write   # the keyless signature of promote.json: this job and release.yml are the only ones that may
      contents: write   # gh release create, upload and publish of the promote-<tag>-<sequence> release (promote.json and its bundle), nothing else
    steps:
      - name: Mask the release code
        env:
          RELEASE_CODE: ${{ inputs.code }}
        run: |
          python3 -I - <<'PY'
          import os, re
          # every character a line break may be, by number (no invisible character is typed into this file); U+2028 and U+2029 are line breaks to YAML itself
          breaks = "[\\r\\n\\v\\f\\x1c-\\x1e\\x85" + chr(0x2028) + chr(0x2029) + "]"
          for part in re.split(breaks, os.environ.get("RELEASE_CODE", "")):
              if part:
                  print("::add-mask::" + part)
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the release code
        env:
          RELEASE_CODE: ${{ inputs.code }}
          RELEASE_CODE_SEED: ${{ secrets.PROMOTE_TOTP_SEED }}
        run: python3 -I tools/release_code.py verify
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      - name: Write promote.json
        env:
          PROMOTE_TAG: ${{ inputs.tag }}
          PROMOTE_LIFETIME_DAYS: ${{ inputs.lifetime_days }}
          PROMOTE_REVOKE: ${{ inputs.revoke }}
          PROMOTE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          PROMOTE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          PROMOTE_SUMS_SHA256: ${{ needs.validate.outputs.sums_sha256 }}
        run: |
          python3 -I tools/promote_manifest.py build
          cat promote.json
      - name: Sign promote.json and check the signature
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle promote.json.sigstore.json promote.json
          # The identity the client pins: this workflow, this ref, a workflow_dispatch run in this repository.
          cosign verify-blob promote.json --bundle promote.json.sigstore.json \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref refs/heads/promote \
            --certificate-github-workflow-trigger workflow_dispatch
      - name: Publish the promotion as its own release
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # This repository's releases are immutable: a published release takes no new asset and its tag can never move, so a promotion is never added to the
          # product release. Each promotion is its own release, promote-<tag>-<sequence>: created as a DRAFT, given both files and only then published (the order
          # release.yml uses), a pre-release and never "Latest" (the updater, the Windows dry run and the cask read Latest, and they must never see this one).
          # A second promotion of a tag (to revoke) is a new release with a higher sequence; nothing is ever replaced.
          seq="$(jq -r .sequence promote.json)"
          [[ "$seq" =~ ^[0-9]+$ ]] || { echo "the manifest's sequence is not a number"; exit 1; }
          name="promote-${PROMOTE_TAG}-${seq}"
          if gh release view "$name" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "a release named ${name} already exists: nothing is replaced"
            exit 1
          fi
          gh release create "$name" --repo "${GITHUB_REPOSITORY}" --draft --prerelease --latest=false --target "${GITHUB_SHA}" --title "$name" \
            --notes "Promotion of ${PROMOTE_TAG}, sequence ${seq}. Not a product release: it holds only promote.json and its Sigstore bundle."
          gh release upload "$name" promote.json promote.json.sigstore.json --repo "${GITHUB_REPOSITORY}"
          gh release edit "$name" --repo "${GITHUB_REPOSITORY}" --draft=false --latest=false
          {
            echo "### Promoted ${PROMOTE_TAG} as ${name}"
            echo
            # A release that is still flagged pre-release (every release is, until approve-release flips it) is signed as one and the client refuses it:
            # say so, so a promotion that cannot install anything is not mistaken for a working one. The order is approve the release first, then promote.
            if [ "$(jq -r .prerelease promote.json)" = true ]; then
              echo "**prerelease: true, clients will refuse this promotion** (approve the release first, then promote it)"
              echo
            fi
            echo "Revoked versions in this manifest: $(jq -r 'if (.revoked | length) == 0 then "none" else (.revoked | join(", ")) end' promote.json)"
            echo
            echo '```json'
            cat promote.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
