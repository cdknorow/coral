name: cloud-tests
# Tests for the Cloud Hub connector, the shared tunnel packages and the cloud-mode frontend.
# (The whole suite is much slower; these are the packages the Cloud Hub depends on.)
on:
  pull_request:
    paths:
      - "coral-go/pkg/**"
      - "coral-go/internal/cloud/**"
      - "coral-go/internal/server/**"
      - "coral-go/internal/startup/**"
      - "coral-go/internal/store/cloud_connection*.go"
      - "tests/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - name: pkg and connector tests (dev build)
        working-directory: coral-go
        run: go test -race -count=1 -tags 'dev fts5' ./pkg/... ./internal/cloud/... ./internal/startup/...
      - name: route census (every registered route has a reviewed tier)
        working-directory: coral-go
        run: go test -count=1 -tags 'dev fts5' ./internal/server -run 'TestCloud|TestGuard'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: install
        working-directory: tests/frontend
        run: npm install --no-audit --no-fund --no-package-lock
      - name: cloud-mode frontend tests
        working-directory: tests/frontend
        run: npm run test:cloud

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # secrets scan covers the whole history
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - name: secrets (gitleaks, fingerprints in .gitleaksignore)
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 detect --source . --config .gitleaks.toml --no-banner --redact
      - name: reachable vulnerabilities (govulncheck)
        working-directory: coral-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags 'fts5' ./pkg/... ./internal/cloud/... ./internal/startup/...

  browser:
    # Real headless Chrome (pinned): the cloud-mode page under the hub's exact CSP, and the fetch-metadata
    # headers the file-bounds rely on. The rest of tests/frontend (44 CDP suites) has 6 failures that also
    # fail on clean main, so only the cloud-specific suites gate here; run the whole set with
    # `node tests/frontend/run_cdp_suites.mjs`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - id: chrome
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1
        with:
          chrome-version: "155.0.8059.40" # the version the suites were run against; bump deliberately
      - name: install
        working-directory: tests/frontend
        run: npm install --no-audit --no-fund --no-package-lock
      - name: cloud-mode CSP and fetch-metadata suites in real Chrome
        working-directory: tests/frontend
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node run_cdp_suites.mjs --timeout 90 --only cloud_csp_browser,fetch_metadata_browser
