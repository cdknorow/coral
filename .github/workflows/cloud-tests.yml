name: cloud-tests
# Tests for the Cloud Hub connector, the shared tunnel packages and the cloud-mode frontend.
# (The whole suite is much slower; these are the packages the Cloud Hub depends on.)
on:
  pull_request:
    paths:
      - "coral-go/pkg/**"
      - "coral-go/internal/cloud/**"
      - "coral-go/internal/server/**"
      - "coral-go/internal/startup/**"
      - "coral-go/internal/store/cloud_connection*.go"
      - "tests/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

# CI sends no usage events. Its builds carry no PostHog key, and this keeps it so if one ever does (#4936).
env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  go:
    # Both builds are tested on purpose. The dev build (-tags dev) allows a cleartext loopback hub and
    # runs the behavioural suites; the release build (plain -tags fts5) is what ships: it refuses a
    # cleartext hub, compiles the url_release tests and the real route/file-bound rules. A suite that
    # only passes in dev would hide a defect in the shipped configuration.
    name: go (${{ matrix.build }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: dev
            tags: "dev fts5"
          - build: release
            tags: "fts5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - name: pkg and connector tests
        working-directory: coral-go
        run: go test -race -timeout 30m -count=1 -tags '${{ matrix.tags }}' ./pkg/... ./internal/cloud/... ./internal/startup/...
      - name: route census (every registered route has a reviewed tier)
        working-directory: coral-go
        run: go test -count=1 -tags '${{ matrix.tags }}' ./internal/server -run 'TestCloud|TestGuard'
      - name: file bounds (strict by default; only the local dashboard relaxes them)
        working-directory: coral-go
        run: go test -count=1 -tags '${{ matrix.tags }}' ./internal/server/routes -run 'TunnelBounds|StrictIs|LocalDashboard|GitDirectory|HomeRooted|Listings|Sensitive|SearchFilesDir|SaveFileContentTunnel|ResolvePath'

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund # exactly package-lock.json, no install scripts (#3675)
      - name: cloud-mode frontend tests
        working-directory: tests/frontend
        run: npm run test:cloud

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # secrets scan covers the whole history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - name: secrets (gitleaks, fingerprints in .gitleaksignore)
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 detect --source . --config .gitleaks.toml --no-banner --redact
      - name: reachable vulnerabilities (govulncheck, the whole module, every tier's tag set)
        working-directory: coral-go
        # A reachable finding fails the step (govulncheck exits non-zero). The tag sets are the
        # release tiers' (prod, dev, dropboxers, beta), each with fts5 as the builds use (#3675).
        run: |
          for tags in fts5 fts5,dev fts5,dropboxers fts5,beta; do
            echo "== govulncheck -tags $tags"
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags "$tags" ./...
          done
      - name: go.mod and go.sum are tidy
        working-directory: coral-go
        run: go mod tidy -diff

  browser:
    # Real headless Chrome (pinned): the cloud-mode page under the hub's exact CSP, and the fetch-metadata
    # headers the file-bounds rely on. The rest of tests/frontend (44 CDP suites) has 6 failures that also
    # fail on clean main, so only the cloud-specific suites gate here; run the whole set with
    # `node tests/frontend/run_cdp_suites.mjs`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          install-dependencies: true # shared libraries the headless binary needs on a bare runner
          chrome-version: "155.0.8059.39" # the suites were developed on 155.0.8059.40 locally; CI uses the nearest published known-good build of the same major; bump deliberately
      - name: install
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund # exactly package-lock.json, no install scripts (#3675)
      - name: cloud-mode CSP and fetch-metadata suites in real Chrome
        working-directory: tests/frontend
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node run_cdp_suites.mjs --timeout 180 --only cloud_csp_browser,fetch_metadata_browser,agent_ui_panel_sandbox_browser
