name: go-shuffle
# Test-order and shared-state defects (#5207). A single `go test -shuffle=on -count=3` run found six latent defects that every
# fixed-order run had hidden (QA's census, #5148): a test that only passes after another, or only once per process. Nothing keeps
# that from coming back, so this runs every package nightly on the default branch with a random test order, three times each.
# It is not a per-push gate: three shuffled passes of every package take about 25 minutes of wall time per shard.
#
# The seed is printed first, in the job summary and the log, and `go test` prints the seed it used on a failure too: a failure
# reproduces with `go test -shuffle=SEED -count=3 <package>` locally (a dispatch with the seed input runs the same order again).
# A failure here is filed as a task, not a reason to hold a release.
#
# Same shards and the same two tag sets as go-tests.yml (the default build, and 'dev fts5'): internal/server/routes alone, pkg/tunnel
# alone because its throughput tests measure bytes per second and fail next to other packages' load, and every other package. Trust, as go-tests.yml: no
# pull_request trigger (a fork's code never runs here), no secrets, read-only contents, actions pinned by SHA, nothing cached.
# CORAL_TELEMETRY_DISABLED=1 like every CI workflow (the telemetry census); the packages whose tests check what is sent clear it
# in their own TestMain.
on:
  schedule:
    - cron: "07 10 * * *" # 10:07 UTC every day, on the default branch
  workflow_dispatch:
    inputs:
      seed:
        description: "Shuffle seed (empty: derived from the run id); the seed of a failed run, to run its order again"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: go-shuffle-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  go:
    name: go shuffle (${{ matrix.tagname }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        tagname: [default, dev-fts5]
        shard: [routes, tunnel, rest]
        include:
          - { tagname: default, tags: "" }
          - { tagname: dev-fts5, tags: "dev fts5" }
    env:
      CORAL_TELEMETRY_DISABLED: "1"
      ROUTES_PKG: internal/server/routes
      TUNNEL_PKG: pkg/tunnel
    defaults:
      run:
        shell: bash
        working-directory: coral-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache: false # nothing cached here: see the header
      - name: tmux and git (the terminal tests start a real tmux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux git
          tmux -V
      - name: go test -shuffle (${{ matrix.tagname }}, ${{ matrix.shard }})
        env:
          TAGS: ${{ matrix.tags }}
          SHARD: ${{ matrix.shard }}
          SEED_INPUT: ${{ github.event.inputs.seed }}
        run: |
          set -euo pipefail
          # A short temp dir: a long TMPDIR breaks tmux socket paths.
          export TMPDIR=/tmp/gt
          mkdir -p "$TMPDIR"
          seed="${SEED_INPUT:-}"
          case "$seed" in ''|*[!0-9]*) [ -z "$seed" ] || { echo "::error::the seed must be a number"; exit 1; } ;; esac
          # one seed for the run, the same in all three shards (the run id), so one line reproduces any shard's order
          [ -n "$seed" ] || seed=$(( GITHUB_RUN_ID % 2000000000 ))
          echo "shuffle seed: $seed (reproduce: go test ${TAGS:+-tags \"$TAGS\" }-shuffle=$seed -count=3 <package>)"
          { echo "### go shuffle ($SHARD): seed \`$seed\`"; echo; echo "Reproduce: \`go test -shuffle=$seed -count=3 <package>\`"; } >> "$GITHUB_STEP_SUMMARY"
          root=$(go list -m)
          all=(); while IFS= read -r p; do all+=("${p#"$root"/}"); done < <(go list ${TAGS:+-tags "$TAGS"} ./...)
          for need in "$ROUTES_PKG" "$TUNNEL_PKG"; do
            printf '%s\n' "${all[@]}" | grep -qxF "$need" || { echo "::error::package $need no longer exists: update go-shuffle.yml"; exit 1; }
          done
          pkgs=()
          for p in "${all[@]}"; do
            case "$SHARD" in
              routes) [ "$p" = "$ROUTES_PKG" ] || continue ;;
              tunnel) [ "$p" = "$TUNNEL_PKG" ] || continue ;;
              rest) { [ "$p" = "$ROUTES_PKG" ] || [ "$p" = "$TUNNEL_PKG" ]; } && continue ;;
            esac
            pkgs+=("./$p")
          done
          echo "go shuffle (${TAGS:-default tags}), shard $SHARD: ${#pkgs[@]} of ${#all[@]} packages"
          [ "${#pkgs[@]}" -gt 0 ] || { echo "::error::an empty shard"; exit 1; }
          go test -shuffle="$seed" -count=3 -p 4 -timeout 65m ${TAGS:+-tags "$TAGS"} "${pkgs[@]}"
