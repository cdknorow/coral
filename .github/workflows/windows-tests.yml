name: windows-tests
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source revision under test
        required: true
        type: string
      capture:
        description: Refresh only the Windows Settings fixture
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  cdp-settings-fixture:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      CORAL_TELEMETRY_DISABLED: "1"
      CHROME: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install frontend test dependencies
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record source revision
        shell: pwsh
        run: git rev-parse HEAD | Out-File -Encoding utf8 tests/frontend/windows-source.txt
      - name: Capture or compare on isolated Windows server
        working-directory: tests/frontend
        shell: pwsh
        run: |
          $suiteNames = 'settings_modal_trace,agent_task_cli,terminal_backend,ui_audit_batch3,touch_targets,terminal_input_ack'
          if ('${{ inputs.capture }}' -eq 'true') {
            $env:CORAL_UPDATE_GOLDEN = '1'
            $suiteNames = 'settings_modal_trace'
          }
          node run_cdp_suites.mjs --only $suiteNames --shards 1 --retries 0 --timeout 180 --keep 2>&1 | Tee-Object -FilePath windows-settings-run.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-settings-fixture-6092
          path: |
            tests/frontend/fixtures/settings_modal_trace.windows.json
            tests/frontend/windows-settings-run.txt
            tests/frontend/windows-source.txt
          retention-days: 7
