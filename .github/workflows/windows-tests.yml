name: windows-tests
# Runs go test on Windows for every package (since 2026-10-16; before, a hand-kept list from #3614), so the paths
# Security flagged as compile-only actually run: reparse points and link counts
# (GetFileInformationByHandle) in safefs, routes, agent and background; UNC and device-path refusal
# in auto-attach; the no-hooks path in gitutil; the token owner check in cliauth; ptymanager's
# Windows input and pipe-log code; the data folder's ACL in config (#3637); and the secret key files'
# access-list check in secfile and secretbox, with the stub-hub enrollment in cloud (#3693). The server builds
# with CGO_ENABLED=0 and -tags fts5 (the pure-Go SQLite driver), as release.yml's Windows build
# does, so no C toolchain is needed.
#
# REQUIRED since 2026-10-15: green on ci/3641 (run 38814223172) and on main 725773f8 (run 38817692004);
# a Windows failure now fails this workflow.
on:
  push:
    branches: [main]
    paths:
      - "coral-go/**"
      - "tests/windows/**"
      - ".github/workflows/windows-tests.yml"
  pull_request:
    paths:
      - "coral-go/**"
      - "tests/windows/**"
      - ".github/workflows/windows-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      CORAL_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: bash
        working-directory: coral-go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - name: "#4136 loop (ci/ branch only, never landed): the uplink test 10 times, the agentprio and redact tests"
        run: |
          set -o pipefail
          rc=0
          go test -tags fts5 -count=10 -v -run '^TestUplinkSmallRepliesOvertakeBulk$' ./pkg/tunnel > up.log 2>&1 || rc=1
          grep -E -- "small 2 KB reply|--- FAIL|Error:|^(ok|FAIL)" up.log | head -60
          go test -tags fts5 -count=50 -run 'TestRedactedJSON' ./pkg/tunnel || rc=1
          go test -tags fts5 -count=1 ./internal/peercred ./internal/server/routes -run 'PCB|TestWSCoral_RemoteBurstIsStillCoalesced' || rc=1
          go test -tags fts5 -count=50 -run '^TestTask1589_CodexActivityAssociation$' ./internal/jsonl || rc=1
          exit $rc
