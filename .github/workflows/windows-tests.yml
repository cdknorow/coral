name: windows-tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corrections:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: 1
            revision: 147d1690ec745583791f916da42383fe7a2d8ee2
            command: go test -tags fts5 ./internal/hooks ./cmd/coral-agent ./internal/clihelp ./internal/clierr -count=1 -v
          - stack: 2
            revision: 325998bc6211edd8196f0d9fb70010caba1c86d5
            command: go test -tags fts5 ./internal/logsafe ./internal/config ./internal/cliauth -count=1 -v
          - stack: 3
            revision: 46b53272aef6343e4b890acd1ac390cfca8ceb40
            command: go test -tags fts5 ./internal/logsafe ./internal/server/routes -run 'TestNoLogCallTakesAPathExceptThroughLogsafe|TestPersistedDiff|TestGeneratePersistedDiff|TestSkippedNewFilesNoteWording|TestFileOpensInRoutesAreReviewed' -count=1 -v
    env:
      CGO_ENABLED: "0"
      CORAL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ matrix.revision }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: coral-go/go.mod
          cache-dependency-path: coral-go/go.sum
      - name: Native Windows correction checks
        working-directory: coral-go
        shell: pwsh
        run: |
          ${{ matrix.command }} 2>&1 | Tee-Object -FilePath windows-correction-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-correction-tests-${{ matrix.stack }}
          path: coral-go/windows-correction-tests.txt
          retention-days: 7
