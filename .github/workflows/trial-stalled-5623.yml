name: trial-stalled-5623
on:
  push:
    branches: [trial/stalled-5623]
env:
  CORAL_TELEMETRY_DISABLED: "1"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - shell: bash
        run: cd coral-go && go test -count=30 -run TestStalledLocalBodyFreesItsSlot ./pkg/tunnel
