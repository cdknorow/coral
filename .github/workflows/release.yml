name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Release binaries contain the production analytics key. CI execution of those
# binaries is verification traffic, not product usage.
env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  # ── What this tag builds ───────────────────────────────────────
  # One place for the tier logic and the shipped program lists (#3855): every build job reads
  # these outputs (tests/release/resolve_release.sh, its table in resolve_release_test.sh).
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read   # the provenance record reads the heavy gates' runs on the tagged code
    outputs:
      version: ${{ steps.r.outputs.version }}
      build_tags: ${{ steps.r.outputs.build_tags }}
      prerelease: ${{ steps.r.outputs.prerelease }}
      commands: ${{ steps.r.outputs.commands }}
      gui_commands: ${{ steps.r.outputs.gui_commands }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The Go toolchain the module asks for: the linker-flag check below builds ./cmd/coral (#5539).
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      # The release provenance record (#5550): who pushed the tag, which commit, whether it is on main, and whether go-tests, go-race and
      # cdp-gate passed on that exact code (the tagged notes commit is gated by its parent). A release is not built from code whose gates failed.
      - name: Record the release provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 tests/release/release_provenance.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$ACTOR" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resolve the tier, version and program lists
        id: r
        run: |
          set -euo pipefail
          python3 -I tests/release/release_provenance_test.py
          bash tests/release/resolve_release_test.sh
          bash tests/release/install_cli_tools_test.sh
          bash tests/release/require_cosign_test.sh
          bash tests/release/release_homes_test.sh
          bash tests/release/download_section_test.sh   # the Download section of the notes (#5467); no network
          bash tests/release/approve_release_test.sh    # the Approve release workflow's script (#5559); a stand-in gh, no network
          bash tests/release/update_tap_test.sh         # the cask move (#5559); a local bare repository, no network
          bash tests/release/release_cadence_test.sh    # the cadence table (#5559); a stand-in gh, no network
          bash tests/release/release_notes_edits_test.sh   # lines removed from a published body on purpose; no network
          bash tests/release/ldflags_build_test.sh      # every build script's -X flags take effect: version and PostHog key land in the binary (#5539)
          bash tests/release/resolve_release.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  # ── Linux ──────────────────────────────────────────────────────
  # linux-runner-dryrun.yml mirrors these steps; keep the two in step.
  # Each architecture builds and is smoke-tested on its own native runner: the
  # smoke tests refuse emulation as acceptance evidence.
  build-linux:
    name: build-linux (${{ matrix.arch }})
    needs: [resolve]
    runs-on: ${{ matrix.runner }}
    environment: release # the release secrets live in this environment only: tags v* and the owner's approval (#5522)
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum

      # Go checks a module against go.sum only when it downloads it, not when it reuses a cached
      # copy: re-hash every restored module (Security's MUST on #4251).
      - name: Verify the restored modules against go.sum
        working-directory: coral-go
        run: |
          set -euo pipefail
          out="$(go mod verify 2>&1)" || true
          echo "$out"
          [ "$out" = "all modules verified" ] || { echo "::error::go mod verify: the module cache does not match go.sum"; exit 1; }

      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh

      - name: Build Linux binaries (${{ matrix.arch }})
        working-directory: coral-go
        env:
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_TAGS: ${{ needs.resolve.outputs.build_tags }}
          COMMANDS: ${{ needs.resolve.outputs.commands }}
        run: |
          LDFLAGS="-s -w -X github.com/subgentic/coral/internal/config.PostHogKey=${POSTHOG_PROJECT_KEY} -X github.com/subgentic/coral/internal/config.Version=${VERSION}"
          mkdir -p ../dist/linux
          for cmd in $COMMANDS; do
            [ -d "./cmd/$cmd" ] || continue
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build \
              -tags "$BUILD_TAGS" \
              -ldflags "$LDFLAGS" \
              -o "../dist/linux/$cmd" \
              "./cmd/$cmd/"
          done
          ../tests/release/verify_standard_bundle.sh ../dist/linux "$ARCH"

      # The package's licenses/ folder: the notices of exactly the modules these binaries link, the
      # dashboard's vendored libraries and fonts, and Coral's license (installers/third-party-notices.sh).
      - name: Third-party notices
        run: |
          set -euo pipefail
          (cd coral-go && go mod download)
          bins=(); for f in dist/linux/*; do [ -f "$f" ] && bins+=("$f"); done
          bash installers/third-party-notices.sh dist/linux/licenses "${bins[@]}"
          bash tests/release/verify_notices.sh dist/linux/licenses "${bins[@]}"

      - name: Smoke test package on Ubuntu 22.04
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          package="$PWD/dist/linux"
          docker run --rm --network none --platform "linux/$ARCH" -v "$package:/pkg:ro" ubuntu:22.04 /pkg/coral -h
          docker run --rm --network none --platform "linux/$ARCH" -v "$package:/pkg:ro" ubuntu:22.04 /pkg/launch-coral -h
          docker run --rm --network none --platform "linux/$ARCH" -v "$package:/pkg:ro" ubuntu:22.04 /pkg/coral-board workflow --help

      - name: Verify server and board commands without shared libraries
        run: python3 tests/release/smoke_standard_linux.py dist/linux ${{ matrix.arch }}

      - name: Create tarball
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist/linux
          tar czf "../coral-linux-${ARCH}-${VERSION}.tar.gz" .

      # The file that is published, unpacked and run on this architecture's own runner: version, dashboard, a stand-in agent launch and answer,
      # a clean stop (tests/release/smoke_linux.sh, #5306). Nothing leaves the machine; it fails the build with the item named.
      - name: Smoke test the tarball
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: tests/release/smoke_linux.sh "dist/coral-linux-${ARCH}-${GITHUB_REF_NAME#v}.tar.gz" --version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coral-linux-${{ matrix.arch }}
          path: dist/coral-linux-${{ matrix.arch }}-*.tar.gz

  # ── Windows ──────────────────────────────────────────────────
  build-windows:
    needs: [resolve]
    runs-on: windows-latest
    environment: release # the release secrets live in this environment only: tags v* and the owner's approval (#5522)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum

      - name: Install native GUI compiler
        run: choco install mingw -y

      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh

      - name: Build Windows binaries (amd64)
        working-directory: coral-go
        env:
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_TAGS: ${{ needs.resolve.outputs.build_tags }}
          COMMANDS: ${{ needs.resolve.outputs.commands }}
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $version = $env:VERSION
          $ldflags = "-s -w -X github.com/subgentic/coral/internal/config.PostHogKey=$env:POSTHOG_PROJECT_KEY -X github.com/subgentic/coral/internal/config.Version=$version"
          $buildTags = $env:BUILD_TAGS
          # The exes' version information (what the taskbar and Task Manager name the app by): this release's version and the tier's product name.
          $product = if (",$buildTags," -like "*,dropboxers,*") { "Coral For Dropbox" } else { "Coral" }
          bash ../tools/gen_windows_resources.sh $version $product
          if ($LASTEXITCODE -ne 0) { throw "gen_windows_resources.sh failed" }
          New-Item -ItemType Directory -Force -Path ..\dist\windows\bin | Out-Null

          $env:CGO_ENABLED = "0"
          foreach ($cmd in ($env:COMMANDS -split ' ')) {
            if (Test-Path "./cmd/$cmd") {
              go build -tags $buildTags -ldflags "$ldflags" -o "..\dist\windows\bin\$cmd.exe" "./cmd/$cmd/"
            }
          }

          # CGO binaries (systray, webview)
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          $webviewTags = "webview,$buildTags"
          go build -tags $buildTags -ldflags "-H windowsgui $ldflags" -o "..\dist\windows\bin\coral-tray.exe" "./cmd/coral-tray/"
          go build -tags $webviewTags -ldflags "-H windowsgui $ldflags" -o "..\dist\windows\bin\coral-app.exe" "./cmd/coral-app/"
          powershell -ExecutionPolicy Bypass -File ..\tests\release\verify_standard_bundle.ps1 -PackageDir ..\dist\windows\bin

      # dist\windows\bin\licenses goes into the portable ZIP (bin\*) and the MSI (Coral\licenses, tools/coral.wxs).
      - name: Third-party notices
        shell: bash
        run: |
          set -euo pipefail
          (cd coral-go && go mod download)
          bash installers/third-party-notices.sh dist/windows/bin/licenses dist/windows/bin/*.exe
          bash tests/release/verify_notices.sh dist/windows/bin/licenses dist/windows/bin/*.exe

      # Windows is beta: signing is opt-in through the repository variable
      # WINDOWS_SIGNING ('true' turns it on; unset or anything else leaves the
      # packages unsigned, as in v1.3.43). When on, every signing step is
      # required and missing credentials fail the tag build.
      - name: Warn that Windows packages are unsigned
        if: vars.WINDOWS_SIGNING != 'true'
        shell: bash
        run: |
          echo "::warning::Windows packages are UNSIGNED (beta). Set the repository variable WINDOWS_SIGNING=true and the Trusted Signing secrets to sign them."
          echo "### :warning: Windows packages are UNSIGNED (beta)" >> "$GITHUB_STEP_SUMMARY"

      # Windows code signing uses Azure Trusted Signing (Artifact Signing): the
      # private key never leaves Microsoft's HSM, so there is no .pfx to leak.
      # Release tags are the only trigger for this workflow, so every run must
      # sign; missing configuration fails the job instead of shipping unsigned.
      - name: Require Windows release signing credentials
        if: vars.WINDOWS_SIGNING == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET TRUSTED_SIGNING_ENDPOINT TRUSTED_SIGNING_ACCOUNT TRUSTED_SIGNING_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for a signed Windows release"
              exit 1
            fi
          done

      - name: Sign executables
        if: vars.WINDOWS_SIGNING == 'true'
        uses: ./.github/actions/windows-sign   # a local action: its nested actions/cache@v4 is resolved only when this step runs
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\windows\bin
          files-folder-filter: exe

      - name: Verify signed executables
        if: vars.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $exes = Get-ChildItem dist\windows\bin -Filter *.exe
          if (-not $exes) { throw "no executables found to verify" }
          foreach ($exe in $exes) {
            & $signtool verify /pa /v $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed: $($exe.Name)" }
          }
          echo "SIGNTOOL=$signtool" >> $env:GITHUB_ENV

      # The package version, for the portable ZIP's name too (the MSI step below is skipped for the Dropbox tier).
      - name: Resolve the Windows package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace "^v", ""
          if (-not ($version -match "^\d+\.\d+\.\d+")) { $version = "0.0.0" }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      # The Coral For Dropbox tier ships no MSI (operator decision, 2026-10-21): only its portable ZIP. Every MSI step is skipped for it.
      - name: Install WiX and build MSI
        if: ${{ !contains(format(',{0},', needs.resolve.outputs.build_tags), ',dropboxers,') }}
        env:
          # A tag name may hold $( ) and quotes: it reaches the script as data, never as script text.
          REF_NAME: ${{ github.ref_name }}
          BUILD_TAGS: ${{ needs.resolve.outputs.build_tags }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2
          $version = $env:REF_NAME -replace "^v", ""
          if (-not ($version -match "^\d+\.\d+\.\d+")) { $version = "0.0.0" }
          $binDir = (Resolve-Path "dist\windows\bin").Path
          $buildDir = (Resolve-Path "dist\windows").Path
          Copy-Item "tools\license.rtf" $buildDir
          $msiPath = Join-Path $buildDir "Coral-$version-x64.msi"
          wix build tools\coral.wxs -ext WixToolset.UI.wixext -d "Version=$version" -d "BinDir=$binDir" -d "BuildDir=$buildDir" -o $msiPath
          echo "MSI_PATH=$msiPath" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Sign MSI
        if: ${{ vars.WINDOWS_SIGNING == 'true' && !contains(format(',{0},', needs.resolve.outputs.build_tags), ',dropboxers,') }}
        uses: ./.github/actions/windows-sign   # a local action: its nested actions/cache@v4 is resolved only when this step runs
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\windows
          files-folder-filter: msi

      - name: Verify signed MSI
        if: ${{ vars.WINDOWS_SIGNING == 'true' && !contains(format(',{0},', needs.resolve.outputs.build_tags), ',dropboxers,') }}
        run: |
          & $env:SIGNTOOL verify /pa /v $env:MSI_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed: MSI" }

      - name: Create portable ZIP
        run: |
          $zipPath = "dist\windows\Coral-$env:VERSION-x64-portable.zip"
          Compress-Archive -Path "dist\windows\bin\*" -DestinationPath $zipPath
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      # Start the shipped package: catch a startup break (the v1.4.67 strict-local-auth gap would
      # have hit Windows the same way) before it ships. pwsh (7) for -SkipHttpErrorCheck.
      # The stand-in agent CLI (cmd/mock-agent) is built here, not shipped: the launch check runs it in place of a real CLI.
      - name: Smoke test the portable package and the MSI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_TAGS: ${{ needs.resolve.outputs.build_tags }}
        run: |
          Push-Location coral-go
          $standin = Join-Path $env:RUNNER_TEMP 'standin\claude.exe'
          go build -tags "$env:BUILD_TAGS" -o $standin ./cmd/mock-agent
          if ($LASTEXITCODE -ne 0) { throw "go build ./cmd/mock-agent failed" }
          Pop-Location
          ./tests/release/smoke_windows.ps1 -Zip $env:ZIP_PATH -Msi $env:MSI_PATH -Version $env:RELEASE_VERSION -StandIn $standin
          if ($LASTEXITCODE -ne 0) { throw "smoke_windows.ps1 failed" }

      - name: Upload MSI artifact
        if: ${{ !contains(format(',{0},', needs.resolve.outputs.build_tags), ',dropboxers,') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coral-windows-msi
          path: ${{ env.MSI_PATH }}

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coral-windows-portable
          path: ${{ env.ZIP_PATH }}

  # ── macOS ──────────────────────────────────────────────────────
  # Build each architecture on its native hosted runner. macos-14 is arm64
  # and macos-15-intel is Intel. Keep native GUI deployment at macOS 13.0.
  build-macos-arm64:
    needs: [resolve]
    runs-on: macos-14
    environment: release # the release secrets live in this environment only: tags v* and the owner's approval (#5522)
    permissions:
      contents: read
      attestations: read # the cached tmux payload's attestation (bundled-tmux)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Go from go.dev, checksum-pinned: one copy for the three macOS jobs (#3855). The Go caches are
      # main's (release-cache-warm.yml), restored only (#4126 item 2).
      - uses: ./.github/actions/setup-go-macos
        with:
          cache: restore
      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh
      - name: Build arm64 binaries
        working-directory: coral-go
        env:
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_TAGS: ${{ needs.resolve.outputs.build_tags }}
          COMMANDS: ${{ needs.resolve.outputs.commands }}
          GUI_COMMANDS: ${{ needs.resolve.outputs.gui_commands }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/subgentic/coral/internal/config.PostHogKey=${POSTHOG_PROJECT_KEY} -X github.com/subgentic/coral/internal/config.Version=${VERSION}"
          mkdir -p ../dist/macos-arm64
          for cmd in $COMMANDS; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags "$BUILD_TAGS" -ldflags "$LDFLAGS" -o "../dist/macos-arm64/$cmd" "./cmd/$cmd/"
          done
          for cmd in $GUI_COMMANDS; do
            MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0" GOOS=darwin GOARCH=arm64 go build -tags "webview,$BUILD_TAGS" -ldflags "$LDFLAGS" -o "../dist/macos-arm64/$cmd" "./cmd/$cmd/"
          done
      # Restored from main's cache when its inputs are unchanged, else built; checked either way (#4126).
      - uses: ./.github/actions/bundled-tmux
        with:
          arch: arm64
          out: dist/macos-arm64/tmux-payload
      - name: Smoke test bundled tmux (arm64)
        working-directory: coral-go
        env:
          CORAL_BUNDLED_TMUX_BIN: ${{ github.workspace }}/dist/macos-arm64/tmux-payload/bin/tmux
          CORAL_BUNDLED_TMUX_TERMINFO: ${{ github.workspace }}/dist/macos-arm64/tmux-payload/terminfo
        run: go test ./internal/tmux -run '^TestBundledPayloadSmoke$' -count=1
      # Made here, where the build filled the module cache (the script makes no network request);
      # build-macos checks the two slices' folders are the same and puts one in Coral.app before signing.
      - name: Third-party notices (arm64)
        env:
          COMMANDS: ${{ needs.resolve.outputs.commands }}
          GUI_COMMANDS: ${{ needs.resolve.outputs.gui_commands }}
        run: |
          set -euo pipefail
          (cd coral-go && go mod download)
          bins=(); for cmd in $COMMANDS $GUI_COMMANDS; do bins+=("dist/macos-arm64/$cmd"); done
          bash installers/third-party-notices.sh --macos dist/macos-arm64/licenses "${bins[@]}"
          bash tests/release/verify_notices.sh dist/macos-arm64/licenses "${bins[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coral-macos-arm64-slices
          path: dist/macos-arm64

  build-macos-amd64:
    needs: [resolve]
    runs-on: macos-15-intel
    environment: release # the release secrets live in this environment only: tags v* and the owner's approval (#5522)
    permissions:
      contents: read
      attestations: read # the cached tmux payload's attestation (bundled-tmux)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Go from go.dev, checksum-pinned: one copy for the three macOS jobs (#3855).
      - uses: ./.github/actions/setup-go-macos
        with:
          cache: restore
      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh
      - name: Build amd64 binaries
        working-directory: coral-go
        env:
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_TAGS: ${{ needs.resolve.outputs.build_tags }}
          COMMANDS: ${{ needs.resolve.outputs.commands }}
          GUI_COMMANDS: ${{ needs.resolve.outputs.gui_commands }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/subgentic/coral/internal/config.PostHogKey=${POSTHOG_PROJECT_KEY} -X github.com/subgentic/coral/internal/config.Version=${VERSION}"
          mkdir -p ../dist/macos-amd64
          for cmd in $COMMANDS; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags "$BUILD_TAGS" -ldflags "$LDFLAGS" -o "../dist/macos-amd64/$cmd" "./cmd/$cmd/"
          done
          for cmd in $GUI_COMMANDS; do
            MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0" GOOS=darwin GOARCH=amd64 go build -tags "webview,$BUILD_TAGS" -ldflags "$LDFLAGS" -o "../dist/macos-amd64/$cmd" "./cmd/$cmd/"
          done
      # Restored from main's cache when its inputs are unchanged, else built; checked either way (#4126).
      - uses: ./.github/actions/bundled-tmux
        with:
          arch: x86_64
          out: dist/macos-amd64/tmux-payload
      - name: Smoke test bundled tmux (x86_64)
        working-directory: coral-go
        env:
          CORAL_BUNDLED_TMUX_BIN: ${{ github.workspace }}/dist/macos-amd64/tmux-payload/bin/tmux
          CORAL_BUNDLED_TMUX_TERMINFO: ${{ github.workspace }}/dist/macos-amd64/tmux-payload/terminfo
        run: go test ./internal/tmux -run '^TestBundledPayloadSmoke$' -count=1
      - name: Third-party notices (x86_64)
        env:
          COMMANDS: ${{ needs.resolve.outputs.commands }}
          GUI_COMMANDS: ${{ needs.resolve.outputs.gui_commands }}
        run: |
          set -euo pipefail
          (cd coral-go && go mod download)
          bins=(); for cmd in $COMMANDS $GUI_COMMANDS; do bins+=("dist/macos-amd64/$cmd"); done
          bash installers/third-party-notices.sh --macos dist/macos-amd64/licenses "${bins[@]}"
          bash tests/release/verify_notices.sh dist/macos-amd64/licenses "${bins[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coral-macos-amd64-slices
          path: dist/macos-amd64

  build-macos:
    needs: [resolve, build-macos-arm64, build-macos-amd64]
    runs-on: macos-14
    environment: release # the release secrets live in this environment only: tags v* and the owner's approval (#5522)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Go from go.dev, checksum-pinned: one copy for the three macOS jobs (#3855).
      - uses: ./.github/actions/setup-go-macos
      - name: Require macOS release signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for a signed, notarized macOS release"
              exit 1
            fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coral-macos-arm64-slices
          path: dist/macos-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coral-macos-amd64-slices
          path: dist/macos-amd64
      - name: Merge and verify universal binaries
        working-directory: coral-go
        env:
          COMMANDS: ${{ needs.resolve.outputs.commands }}
          GUI_COMMANDS: ${{ needs.resolve.outputs.gui_commands }}
        run: |
          set -euo pipefail
          mkdir -p ../dist/macos
          for cmd in $COMMANDS $GUI_COMMANDS; do
            lipo -create -output "../dist/macos/$cmd" "../dist/macos-arm64/$cmd" "../dist/macos-amd64/$cmd"
            chmod +x "../dist/macos/$cmd"
          done
          lipo -create -output ../dist/macos/tmux ../dist/macos-arm64/tmux-payload/bin/tmux ../dist/macos-amd64/tmux-payload/bin/tmux
          chmod +x ../dist/macos/tmux
          diff -qr ../dist/macos-arm64/tmux-payload/terminfo ../dist/macos-amd64/tmux-payload/terminfo
          diff -qr ../dist/macos-arm64/tmux-payload/licenses ../dist/macos-amd64/tmux-payload/licenses
          diff -qr ../dist/macos-arm64/licenses ../dist/macos-amd64/licenses
          cp -R ../dist/macos-arm64/tmux-payload/terminfo ../dist/macos/terminfo
          cp -R ../dist/macos-arm64/tmux-payload/licenses ../dist/macos/tmux-licenses
          cp -R ../dist/macos-arm64/licenses ../dist/macos/licenses
          ../tests/release/verify_standard_bundle.sh ../dist/macos

      - name: Copy .icns icon
        run: |
          # Use pre-built .icns from repo (icons/coral.icns or Coral.icns)
          if [ -f Coral.icns ]; then
            echo "Using Coral.icns from repo root"
          elif [ -f icons/coral.icns ]; then
            cp icons/coral.icns Coral.icns
          else
            echo "Warning: no .icns found, app will have no icon"
          fi

      - name: Create Coral.app bundle
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMANDS: ${{ needs.resolve.outputs.commands }}
          GUI_COMMANDS: ${{ needs.resolve.outputs.gui_commands }}
        run: |
          APP="dist/Coral.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for bin in $COMMANDS $GUI_COMMANDS tmux; do
            cp "dist/macos/$bin" "$APP/Contents/MacOS/$bin"
            chmod +x "$APP/Contents/MacOS/$bin"
          done
          cp -R dist/macos/terminfo "$APP/Contents/Resources/terminfo"
          cp -R dist/macos/tmux-licenses "$APP/Contents/Resources/tmux-licenses"
          # In the bundle before it is signed and notarized, never after (that would break the seal).
          cp -R dist/macos/licenses "$APP/Contents/Resources/licenses"
          bins=(); for b in $COMMANDS $GUI_COMMANDS; do bins+=("$APP/Contents/MacOS/$b"); done
          bash tests/release/verify_notices.sh "$APP/Contents/Resources/licenses" "${bins[@]}"
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" tools/Info.plist > "$APP/Contents/Info.plist"
          [ -f Coral.icns ] && cp Coral.icns "$APP/Contents/Resources/AppIcon.icns"
          cp installers/install-cli.sh "$APP/Contents/MacOS/install-cli.sh"
          chmod +x "$APP/Contents/MacOS/install-cli.sh"
          tests/release/verify_standard_bundle.sh "$APP/Contents/MacOS"

      - name: Smoke test Coral.app
        run: |
          chmod +x tools/test-macos-app.sh
          CI=true tools/test-macos-app.sh dist/Coral.app

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security default-keychain -d user | tr -d '"' | xargs)"
          rm -f certificate.p12
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign Coral.app
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          COMMANDS: ${{ needs.resolve.outputs.commands }}
        run: |
          APP="dist/Coral.app"
          # Sign executable code explicitly before signing the wrapper. The
          # tmux data files and notices are sealed by the outer app signature.
          # The GUI programs are signed below, each with its own entitlements.
          for bin in $COMMANDS; do
            codesign --force --options runtime --sign "$SIGNING_IDENTITY" \
              --entitlements entitlements.plist "$APP/Contents/MacOS/$bin"
          done
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$APP/Contents/MacOS/tmux"
          # WKWebView's app process uses only the minimal entitlement set.
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" \
            --entitlements entitlements-app.plist "$APP/Contents/MacOS/coral-app"
          # Signing the main executable also validates the surrounding app.
          # Sign its nested installer script first so that validation succeeds.
          codesign --force --sign "$SIGNING_IDENTITY" "$APP/Contents/MacOS/install-cli.sh"
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" \
            --entitlements entitlements.plist "$APP/Contents/MacOS/coral-tray"
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" \
            --entitlements entitlements.plist "$APP"
          echo "Verifying..."
          codesign --verify --deep --verbose=2 "$APP"

      # The signed app runs under the hardened runtime with the minimal (empty) entitlements, so a
      # binary that needed an exception (JIT, unsigned memory, library loading) would crash here.
      # The webview is forced on: coral-app is the one most likely to need one (#3659).
      - name: Smoke test the signed Coral.app (hardened runtime, minimal entitlements)
        run: |
          # No signed binary carries a hardened-runtime exception (the tray and the app included).
          for bin in dist/Coral.app/Contents/MacOS/*; do
            [ -x "$bin" ] && [ ! -d "$bin" ] || continue
            if codesign -d --entitlements - "$bin" 2>/dev/null | grep -qE 'allow-jit|allow-unsigned|disable-library'; then
              echo "::error::$(basename "$bin") still has an exception entitlement"; exit 1
            fi
          done
          # Then run the signed app: the tray (cgo) starts the server and must answer, and the
          # webview (coral-app, cgo) is launched and must not crash. A failure here fails the job.
          CI=true SMOKE_TEST_WEBVIEW=1 TEST_PORT=8498 tools/test-macos-app.sh dist/Coral.app

      - name: Verify signed Standard app payload
        run: |
          tests/release/verify_standard_bundle.sh dist/Coral.app/Contents/MacOS
          codesign --verify --deep --strict --verbose=2 dist/Coral.app

      # Notarize and staple the app itself so it still passes Gatekeeper
      # offline after being dragged out of the DMG.
      - name: Notarize and staple Coral.app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Coral.app dist/Coral-notarize.zip
          xcrun notarytool submit dist/Coral-notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          # notarytool --wait exits 0 on Invalid too; staple fails unless Accepted.
          xcrun stapler staple dist/Coral.app
          xcrun stapler validate dist/Coral.app
          rm -f dist/Coral-notarize.zip

      - name: Create DMG
        run: |
          brew install create-dmg
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="Coral.v${VERSION}.dmg"
          VOLICON_ARGS=""
          [ -f Coral.icns ] && VOLICON_ARGS="--volicon Coral.icns"
          create-dmg \
            --volname "Coral" \
            ${VOLICON_ARGS} \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 --icon "Coral.app" 175 190 \
            --app-drop-link 425 190 --no-internet-enable \
            "dist/${DMG_NAME}" "dist/Coral.app"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Sign DMG
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$SIGNING_IDENTITY" "dist/$DMG_NAME"

      - name: Notarize DMG
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          SUBMIT_OUT=$(xcrun notarytool submit "dist/$DMG_NAME" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --output-format json)
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --timeout 30m
          xcrun stapler staple "dist/$DMG_NAME"
          xcrun stapler validate "dist/$DMG_NAME"

      - name: Verify signed, notarized release
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 "dist/$DMG_NAME"
          spctl -a -t open --context context:primary-signature -vv "dist/$DMG_NAME"
          xcrun stapler validate "dist/$DMG_NAME"
          MNT="$RUNNER_TEMP/dmgverify"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$MNT" "dist/$DMG_NAME"
          codesign --verify --deep --strict --verbose=2 "$MNT/Coral.app"
          spctl -a -t exec -vv "$MNT/Coral.app"
          xcrun stapler validate "$MNT/Coral.app"
          # Hardened runtime on every Mach-O in the bundle.
          for f in "$MNT"/Coral.app/Contents/MacOS/*; do
            file "$f" | grep -q "Mach-O" || continue
            info=$(codesign -dv "$f" 2>&1)
            grep -q "flags=.*runtime" <<<"$info" || { echo "::error::hardened runtime missing: $f"; exit 1; }
          done
          hdiutil detach "$MNT"

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coral-macos-dmg
          path: dist/${{ env.DMG_NAME }}

  # ── Create GitHub Release with all assets ──────────────────────
  release:
    if: always() && !failure() && !cancelled()
    permissions:
      contents: write
      id-token: write      # Sigstore keyless signing: this job's GitHub OIDC identity
      attestations: write  # GitHub artifact attestations (build provenance)
    needs: [resolve, build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAGS: ${{ needs.resolve.outputs.build_tags }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The Coral For Dropbox tier ships no MSI (operator decision, 2026-10-21): its portable ZIP is kept, the MSI is neither
          # required nor uploaded, copied or checksummed.
          MSI=(artifacts/coral-windows-msi/*.msi)
          MSI_SUM=(coral-windows-msi/*.msi)
          MSI_STABLE=(Coral-x64.msi)
          case ",$BUILD_TAGS," in *,dropboxers,*) MSI=(); MSI_SUM=(); MSI_STABLE=() ;; esac
          # A DRAFT until every file is attached and the last step publishes it (#5522): an immutable release (a
          # repository setting) takes no new asset and no deletion once published, so nothing is uploaded after that;
          # its notes, title and prerelease flag stay editable (tools/devops/finish-release.sh sets the body).
          # Create the release unless it exists (a re-run of a draft). Test tiers (-dev, -beta, -rc,
          # -forDropbox) are prereleases and never "Latest": installed Corals offer the
          # latest release as an update (resolve_release.sh decides). A failed create fails
          # the step here, not as a misleading upload error later (#3855).
          # Release channels (#5551): EVERY release is published as a pre-release that is not "latest" (the AGENTIC channel);
          # the operator approves it with the Approve release workflow, which flips both and moves the Homebrew cask (the tap
          # is no longer updated here). Installed Corals read "latest", so they stay on the last approved release.
          PRE=(--prerelease --latest=false)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${PRE[@]}"
          fi
          # Publish install packages only; native macOS slices are build inputs.
          # Linux and the macOS DMG are always built, so a missing package is an
          # error. The Windows packages are built and signed on every tag, so
          # they are required too: a missing file or a failed upload fails the
          # step.
          for f in artifacts/coral-linux-amd64/*.tar.gz \
                   artifacts/coral-linux-arm64/*.tar.gz \
                   artifacts/coral-macos-dmg/*.dmg \
                   "${MSI[@]}" \
                   artifacts/coral-windows-portable/*.zip; do
            if [ ! -f "$f" ]; then
              echo "::error::required release package missing: $f"
              exit 1
            fi
            gh release upload "$TAG" "$f" --clobber
          done
          # Stable-name copies (#5333): the same bytes under a name without the version, so
          # /releases/latest/download/<name> never goes stale. They are copies, not separate
          # builds: the same file, listed in SHA256SUMS.txt under both names, with the same
          # Sigstore bundle where the versioned file has one.
          mkdir -p stable
          STABLE=()
          stable_copy() {  # stable_copy "<versioned file>" <stable name>
            cp "$1" "stable/$2"
            STABLE+=("stable/$2")
          }
          stable_copy artifacts/coral-linux-amd64/*.tar.gz coral-linux-amd64.tar.gz
          stable_copy artifacts/coral-linux-arm64/*.tar.gz coral-linux-arm64.tar.gz
          stable_copy artifacts/coral-macos-dmg/*.dmg Coral.dmg
          if [ "${#MSI[@]}" -gt 0 ]; then stable_copy "${MSI[0]}" Coral-x64.msi; fi
          stable_copy artifacts/coral-windows-portable/*.zip Coral-x64-portable.zip
          gh release upload "$TAG" "${STABLE[@]}" --clobber
          # Checksums for every published package, under both names. Linux has no OS-level code
          # signing, so users verify the tarball against this file.
          (cd artifacts && sha256sum coral-linux-amd64/*.tar.gz coral-linux-arm64/*.tar.gz coral-macos-dmg/*.dmg \
            "${MSI_SUM[@]}" coral-windows-portable/*.zip | sed 's#  [^ ]*/#  #') > SHA256SUMS.txt
          (cd stable && sha256sum coral-linux-amd64.tar.gz coral-linux-arm64.tar.gz Coral.dmg "${MSI_STABLE[@]}" Coral-x64-portable.zip) >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          # Keyless signatures (Sigstore bundles: certificate, signature and
          # transparency-log proof) on the checksums and the Linux tarball, which has
          # no OS-level signing. They prove the files were built by this workflow from
          # this tag of this repository. If Sigstore is unreachable the step fails, so
          # a release never claims signatures it lacks; re-run the job (--clobber).
          LINUX_TGZS=(artifacts/coral-linux-amd64/*.tar.gz artifacts/coral-linux-arm64/*.tar.gz)
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
          for tgz in "${LINUX_TGZS[@]}"; do
            cosign sign-blob --yes --bundle "$(basename "$tgz").sigstore.json" "$tgz"
          done
          # Self-check against the identity users pin, before publishing the bundles.
          ID="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          for f in SHA256SUMS.txt "${LINUX_TGZS[@]}"; do
            cosign verify-blob --bundle "$(basename "$f").sigstore.json" \
              --certificate-identity "$ID" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          bundles=(SHA256SUMS.txt.sigstore.json)
          for tgz in "${LINUX_TGZS[@]}"; do bundles+=("$(basename "$tgz").sigstore.json"); done
          # The stable-name Linux tarballs are the same bytes, so the same bundle verifies them: copy it
          # under their names and check each pair before publishing (#5333).
          for arch in amd64 arm64; do
            vb=(artifacts/coral-linux-$arch/*.tar.gz); vb="$(basename "${vb[0]}").sigstore.json"
            cp "$vb" "coral-linux-$arch.tar.gz.sigstore.json"
            cosign verify-blob "stable/coral-linux-$arch.tar.gz" --bundle "coral-linux-$arch.tar.gz.sigstore.json" \
              --certificate-identity "$ID" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            bundles+=("coral-linux-$arch.tar.gz.sigstore.json")
          done
          gh release upload "$TAG" "${bundles[@]}" --clobber

      # The same files as a run artifact: update-tap, tools/devops/cask.sh and tools/verify-release.sh read
      # them here, so our own checks don't add to the release's download counts (#4936).
      - name: Keep SHA256SUMS.txt and the Sigstore bundles as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sums
          path: |
            SHA256SUMS.txt
            *.sigstore.json
          if-no-files-found: error
          overwrite: true  # a re-run of this job replaces the first attempt's
          retention-days: 90  # the longest GitHub allows here: the Approve release workflow's tap job and the weekly re-verify read this artifact

      # The stable-name copies (#5333) as a run artifact too, for the same reason: tools/verify-release.sh reads the
      # packages from the run, so our own checks don't add to the release's download counts (#4936).
      - name: Keep the stable-name copies as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stable
          path: stable/*
          if-no-files-found: error
          overwrite: true  # a re-run of this job replaces the first attempt's

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/coral-linux-amd64/*.tar.gz
            artifacts/coral-linux-arm64/*.tar.gz
            artifacts/coral-macos-dmg/*.dmg
            artifacts/coral-windows-msi/*.msi
            artifacts/coral-windows-portable/*.zip
            SHA256SUMS.txt

      # Publish last (#5522): every asset, the checksums and the Sigstore bundles are attached to the draft above; publishing makes the
      # release visible (and, where the repository setting is on, immutable). update-tap and the checks run after this.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
