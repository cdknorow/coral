name: cross-build
# Every package under coral-go/ builds for every platform Coral ships on (#3450): a call that
# exists on one OS or architecture only (coral-tray's syscall.Dup2 on linux/arm64) fails here
# instead of in a release. Linux and Windows cross-compile from Ubuntu without cgo; macOS needs
# cgo (systray, the webview), so it builds on a macOS runner, arm64 natively and amd64 by clang.
on:
  push:
    # ci/** too: the team lands through gate branches, never pull requests, so a build break that only a cross-build sees (a main package without main under no cgo, #6177)
    # was red on main after it landed. A ci/ branch is built before it lands, as go-tests and gofmt are.
    branches: [main, "ci/**"]
    paths:
      - "coral-go/**.go"
      - "coral-go/go.mod"
      - "coral-go/go.sum"
      - ".github/workflows/cross-build.yml"
  pull_request:
    paths:
      - "coral-go/**.go"
      - "coral-go/go.mod"
      - "coral-go/go.sum"
      - ".github/workflows/cross-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# CI sends no usage events. Its builds carry no PostHog key, and this keeps it so if one ever does (#4936).
env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  linux-windows:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: Go cache paths
        id: gopaths
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Restored on every run; saved only by a push to main (below), so a branch or pull request
      # never writes the cache main reads. The key changes with go.mod (the Go version) and go.sum.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gocache
        with:
          path: |
            ${{ steps.gopaths.outputs.gocache }}
            ${{ steps.gopaths.outputs.gomodcache }}
          key: cross-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('coral-go/go.mod', 'coral-go/go.sum') }}
          restore-keys: cross-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: go build ./... (${{ matrix.target }}, no cgo)
        working-directory: coral-go
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: "0"
        run: GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go build -o /dev/null ./...
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.gocache }}
            ${{ steps.gopaths.outputs.gomodcache }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  darwin:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: Go cache paths
        id: gopaths
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Restored on every run; saved only by a push to main (below), so a branch or pull request
      # never writes the cache main reads. The key changes with go.mod (the Go version) and go.sum.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gocache
        with:
          path: |
            ${{ steps.gopaths.outputs.gocache }}
            ${{ steps.gopaths.outputs.gomodcache }}
          key: cross-build-${{ runner.os }}-${{ runner.arch }}-darwin-${{ matrix.arch }}-${{ hashFiles('coral-go/go.mod', 'coral-go/go.sum') }}
          restore-keys: cross-build-${{ runner.os }}-${{ runner.arch }}-darwin-${{ matrix.arch }}-
      - name: go build ./... (darwin/${{ matrix.arch }}, cgo)
        working-directory: coral-go
        env:
          ARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: GOOS=darwin GOARCH="$ARCH" go build -o /dev/null ./...
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.gocache }}
            ${{ steps.gopaths.outputs.gomodcache }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # The peer-user check reads xnu's private TCP table (net.inet.tcp.pcblist_n, #3905). Its real
  # loopback tests run on both macOS runner kinds, so a macOS image whose structs changed turns
  # this job red before users meet it (in production an unknown layout is "unsupported").
  darwin-peercred:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: go test ./internal/peercred (the real kernel table)
        working-directory: coral-go
        run: go test -count=1 -v ./internal/peercred/...
