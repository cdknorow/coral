name: folder-diag
on:
  push:
    branches: [trial/folder-6199]
permissions:
  contents: read
jobs:
  diag:
    name: diag (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CORAL_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      # Sources are LF, as they ship: Git for Windows' default (autocrlf=true) checks every text file out CRLF, which makes the embedded static tree
      # ~87 KB bigger than the shipped one (TestStaticTreeWithinBudget measured 6453300 bytes here against 6366382 on Linux, budget 6422528) and breaks
      # the dashboard tests that read source lines (action_census.test.mjs's ^registerActions regex). Set before the checkout.
      - name: Check out LF line endings
        shell: bash
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false # nothing cached here, as in cdp-gate.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: install
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: stub agent CLIs first on PATH
        run: |
          stub="$RUNNER_TEMP/stub-cli"
          mkdir -p "$stub"
          for c in claude codex gemini; do
            printf '@echo stub %s: a CDP suite tried to run a real agent CLI 1>&2\r\n@exit /b 1\r\n' "$c" > "$stub/$c.cmd"
          done
          echo "$stub" >> "$GITHUB_PATH"
      - name: Chrome from the runner image
        id: chrome
        run: |
          p='C:\Program Files\Google\Chrome\Application\chrome.exe'
          [ -f "$p" ] || { echo "::error::no Chrome at $p on this runner image"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"
      - name: the three suites, each with its diagnostics, and the golden regenerated
        working-directory: tests/frontend
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CORAL_TELEMETRY_DISABLED: "1"
          CORAL_UPDATE_GOLDEN: "1"
          CDP_FULL: "1"
        run: |
          set -o pipefail
          node run_cdp_suites.mjs --timeout 180 --keep --retries 0 --only launch_folder_browser_use_browser --results-out "$RUNNER_TEMP/results.json" 2>&1 | tee "$RUNNER_TEMP/run.log" || true
          mkdir -p "$RUNNER_TEMP/out"; cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/out/"; cp fixtures/settings_modal_trace.windows.json "$RUNNER_TEMP/out/" || true
      - name: keep the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folder-diag-6162
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
