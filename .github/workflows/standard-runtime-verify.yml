name: Published Standard Linux runtime verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published regular release tag to verify
        required: true
        default: v1.3.19
permissions:
  contents: read
  actions: read  # the release run's artifacts (#4936)
env:
  CORAL_TELEMETRY_DISABLED: "1"
jobs:
  native-linux:
    # Each architecture's package is checked on its own native runner (no emulation).
    name: native-linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      # The package comes from the release run's artifact, not the published release, so this check doesn't
      # count as a download (#4936). Its sha256 must equal the published asset's digest (release metadata,
      # not a download), so it is the published package byte for byte.
      - name: Get the package from the release run and verify the published digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p verify/package
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$RELEASE_TAG" --event push --status success --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$RUN" ] || { echo "::error::no successful release.yml run for $RELEASE_TAG (its artifacts may have expired)"; exit 1; }
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "coral-linux-${ARCH}" -D verify
          gh release view "$RELEASE_TAG" --json assets > verify/assets.json
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib
          name = 'coral-linux-' + os.environ['ARCH'] + '-' + os.environ['RELEASE_TAG'][1:] + '.tar.gz'
          package = pathlib.Path('verify') / name
          assets = json.loads(pathlib.Path('verify/assets.json').read_text())['assets']
          asset, = [item for item in assets if item['name'] == name]
          actual = 'sha256:' + hashlib.sha256(package.read_bytes()).hexdigest()
          assert actual == asset['digest'], (actual, asset['digest'])
          print(name, actual)
          PYCODE
          tar -xzf "verify/coral-linux-${ARCH}-${RELEASE_TAG#v}.tar.gz" -C verify/package
      - name: Verify static package structure
        run: bash tests/release/verify_standard_bundle.sh verify/package ${{ matrix.arch }}
      - name: Run server and board commands without shared libraries
        run: python3 tests/release/smoke_standard_linux.py verify/package ${{ matrix.arch }}
