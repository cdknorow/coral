name: Documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - mkdocs.yml
      - requirements-docs.txt
      - coral-go/site_docs/**
      - coral-go/docs_theme/**
      - tools/check-site-links.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Build and validate site
        run: |
          python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/coral-docs-site"
          python tools/check-site-links.py "$RUNNER_TEMP/coral-docs-site"
      - name: Upload verified site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/coral-docs-site
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
