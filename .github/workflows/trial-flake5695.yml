name: trial-flake5695
on:
  push:
    branches: [trial/flake5695]
env:
  CORAL_TELEMETRY_DISABLED: "1"
jobs:
  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - shell: bash
        run: |
          cd coral-go
          go version
          go test -count=50 -v -run '^TestBackgroundCallersStillAskClaudeWhenSignedIn$' ./internal/background > /tmp/o.log 2>&1 || true
          grep -E "^(ok|FAIL|--- FAIL)" /tmp/o.log | sort | uniq -c
          grep TOOK /tmp/o.log | sed 's/.*TOOK //' | awk '{t=$1; if (t ~ /ms$/) v=t+0; else if (t ~ /µs$/) v=(t+0)/1000; else v=(t+0)*1000; name=""; for (i=3;i<=NF;i++) name=name" "$i; n[name]++; s[name]+=v; if (v>m[name]) m[name]=v} END {for (k in n) printf "%-34s runs=%d avg=%.0fms max=%.0fms\n", k, n[k], s[k]/n[k], m[k]}'
          grep -E "Error:|Messages|expected|actual" /tmp/o.log | sort | uniq -c | head -20
