name: trial-flake5695
on:
  push:
    branches: [trial/flake5695]
env:
  CORAL_TELEMETRY_DISABLED: "1"
jobs:
  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - shell: bash
        run: |
          cd coral-go
          go version
          go test -count=30 -v -run '^TestBackgroundCallersStillAskClaudeWhenSignedIn$' ./internal/background 2>&1 | grep -E "TOOK|--- FAIL|Error:|FAIL|^ok|Messages" | sort | uniq -c | sort -rn | head -60
