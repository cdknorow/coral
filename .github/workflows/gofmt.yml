name: gofmt
# Every Go file under coral-go/ stays gofmt-clean, and every workflow keeps the rules of tests/release/workflows_lint.py (#5369). Runs on pushes to main (most changes land there
# directly), on pushes to ci/** (the landing agent's gate branches, so a batch fails here before it lands,
# #4605) and on pull requests. Fix locally with: cd coral-go && gofmt -w <files listed>.
on:
  push:
    branches: [main, "ci/**"]
    paths:
      - "coral-go/**.go"
      - ".github/workflows/**"
      - "tests/release/workflows_lint.py"
      - "tests/release/gate_check.py"
      - "tests/release/gate_check_test.py"
      - "tests/release/release_provenance.py"
      - "tests/release/release_provenance_test.py"
      - ".github/gate.json"
  pull_request:
    paths:
      - "coral-go/**.go"
      - ".github/workflows/**"
      - "tests/release/workflows_lint.py"
      - "tests/release/gate_check.py"
      - "tests/release/gate_check_test.py"
      - "tests/release/release_provenance.py"
      - "tests/release/release_provenance_test.py"
      - ".github/gate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: gofmt -l (must list nothing)
        working-directory: coral-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt (cd coral-go && gofmt -w <file>):"
            echo "$unformatted"
            exit 1
          fi
      - name: workflows lint (pinned actions, no credentials kept, no input in a script)
        run: python3 -I tests/release/workflows_lint.py
      - name: the required check "gate" (tests/release/gate_check.py, #5522) against a fake GitHub
        run: python3 -I tests/release/gate_check_test.py
      - name: the release provenance record (tests/release/release_provenance.py, #5550) against a fake GitHub
        run: python3 -I tests/release/release_provenance_test.py
