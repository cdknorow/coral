name: gofmt
# Every Go file under coral-go/ stays gofmt-clean. Runs on pushes to main (most changes land there
# directly) as well as on pull requests. Fix locally with: cd coral-go && gofmt -w <files listed>.
on:
  push:
    branches: [main]
    paths:
      - "coral-go/**.go"
      - ".github/workflows/gofmt.yml"
  pull_request:
    paths:
      - "coral-go/**.go"
      - ".github/workflows/gofmt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: gofmt -l (must list nothing)
        working-directory: coral-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt (cd coral-go && gofmt -w <file>):"
            echo "$unformatted"
            exit 1
          fi
