name: cdp-gate
# The full CDP set (tests/frontend/run_cdp_suites.mjs) on GitHub-hosted runners, so a release gate doesn't
# depend on one machine (#4383: epoch dropped three gates on 2026-10-17). Six parts of the default-mode suites
# (--part K/6, each suite in exactly one part, on the default terminal backend, the built-in terminal), the sequences, the strict phase and the tmux phase (--tmux, #6064: the suites that drive tmux itself and a cross-check set) run as separate jobs; each
# uploads its results.json and Coral logs, and one summary job is the check. Same rules as the epoch gate: one
# retry per suite, and a suite that passes only on its retry (FLAKY) fails its part (runner exit 3).
#
# Trust: it runs only on pushes to ci/** (branches the landing agent pushes) and by manual dispatch, never on
# pull_request, so a fork's code never runs here; the job has no secrets and read-only contents; actions are
# pinned by SHA; nothing is cached (a cache written by a ci/ branch could be read by a release, #4251).
# Agent CLIs: stub claude, codex and gemini go first on PATH and fail loudly, so no real CLI can start (#4354).
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:
    # A manual run with suites set repeats only those suites (the repeat job below) instead of the gate: for
    # verifying a flake fix from one place (#4605). Leave suites empty for the normal gate.
    inputs:
      suites:
        description: "Suites to repeat, comma-separated name fragments as --only takes them (empty: the normal gate)"
        required: false
        default: ""
      runs:
        description: "How many times to run each suite (1-50); no retries"
        required: false
        default: "10"
      cpu_throttle:
        description: "CPU throttle for every page (1 = none, up to 8)"
        required: false
        default: "1"
      suite_timeout:
        description: "Seconds before one suite run is killed (1-5400; 180 for the normal gate; a long soak needs more)"
        required: false
        default: "180"

permissions:
  contents: read

# A new push cancels the older push's gate on that branch. A manual run (workflow_dispatch: a repeat, or a gate
# started by hand) has a group of its own, so two repeats on one branch both run: a second dispatch one second after
# the first cancelled it, which read as a failed repeat (run 39135033726, 0 jobs).
concurrency:
  group: cdp-gate-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

# CI sends no usage events. Its builds carry no PostHog key, and this keeps it so if one ever does (#4936).
env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  part:
    name: cdp (${{ matrix.name }})
    if: github.event_name != 'workflow_dispatch' || inputs.suites == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "part 1/6", args: "--part 1/6" }
          - { name: "part 2/6", args: "--part 2/6" }
          - { name: "part 3/6", args: "--part 3/6" }
          - { name: "part 4/6", args: "--part 4/6" }
          - { name: "part 5/6", args: "--part 5/6" }
          - { name: "part 6/6", args: "--part 6/6" }
          - { name: "sequences", args: "--sequences" }
          - { name: "strict", args: "--strict" }
          - { name: "tmux", args: "--tmux" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false # nothing cached here: see the header
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - id: chrome
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1
        with:
          install-dependencies: true
          chrome-version: "155.0.8059.39" # the same pin as cloud-tests.yml; bump both together
      - name: install
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund # exactly package-lock.json, no install scripts (#3675)
      - name: stub agent CLIs first on PATH
        run: |
          stub="$RUNNER_TEMP/stub-cli"
          mkdir -p "$stub"
          for c in claude codex gemini; do
            printf '#!/bin/sh\necho "stub %s: a CDP suite tried to run a real agent CLI ($*)" >&2\nexit 1\n' "$c" > "$stub/$c"
            chmod 755 "$stub/$c"
          done
          echo "$stub" >> "$GITHUB_PATH"
      - name: run ${{ matrix.name }}
        working-directory: tests/frontend
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          ARGS: ${{ matrix.args }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # ARGS holds the runner's flags
          # --fail-on-leak: a suite that leaves the server's settings changed fails its part (exit 5), so a
          # leak is fixed where it starts instead of breaking a later suite on the same shard (#4849).
          node run_cdp_suites.mjs --timeout 180 --keep --fail-on-leak $ARGS --results-out "$RUNNER_TEMP/results.json" 2>&1 | tee "$RUNNER_TEMP/run.log"
      - name: collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/results.json" "$RUNNER_TEMP/out/" 2>/dev/null || true
          # the run's Coral logs (named in the runner's last lines), at most 200 files
          grep -o '/[^ ]*/coral\.log' "$RUNNER_TEMP/run.log" | sort -u | head -200 | while read -r f; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/out/$(echo "$f" | tr '/' '_')"
          done
      - name: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # the attempt in the name: a re-run of the failed parts uploads again, and with one name per
          # part the summary would read whichever copy landed last (v1.4.82: a flaky first attempt
          # reported after a clean re-run)
          name: cdp-${{ strategy.job-index }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: warn

  stripped:
    # The dashboard as a release ships it (#6208): its JS and CSS are embedded already minified (tools/strip-static, passed to go build as -overlay). A few suites that drive the Settings, chat and launch pages run
    # against that build, since minifying is the one thing that could change behaviour only there. Not part of the gate's parts or its summary; a failure here fails this job.
    name: cdp (stripped dashboard)
    if: github.event_name != 'workflow_dispatch' || inputs.suites == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false # nothing cached here: see the header
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - id: chrome
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1
        with:
          install-dependencies: true
          chrome-version: "155.0.8059.39" # the same pin as cloud-tests.yml; bump both together
      - name: install
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund # exactly package-lock.json, no install scripts (#3675)
      - name: stub agent CLIs first on PATH
        run: |
          stub="$RUNNER_TEMP/stub-cli"
          mkdir -p "$stub"
          for c in claude codex gemini; do
            printf '#!/bin/sh\necho "stub %s: a CDP suite tried to run a real agent CLI ($*)" >&2\nexit 1\n' "$c" > "$stub/$c"
            chmod 755 "$stub/$c"
          done
          echo "$stub" >> "$GITHUB_PATH"
      - name: run the Settings, chat and launch suites on the stripped build
        working-directory: tests/frontend
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CORAL_STRIP_STATIC: "1"
        run: |
          set -o pipefail
          node run_cdp_suites.mjs --timeout 180 --shards 1 --retries 0 --only settings_modal_trace_browser,settings_text_budget_browser,composer_sending_browser,launch_agent_pick_browser,live_chat_autoload_browser,startup_sequence_golden_browser 2>&1 | tee "$RUNNER_TEMP/run.log"

  summary:
    name: cdp-gate
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.suites == '')
    needs: [part, stripped]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The suites the flake-repeat job below runs again: FLAKY ones, and the one a part's end check names (comma-separated, at most 3).
      suites: ${{ steps.summary.outputs.suites }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: summary
        id: summary
        env:
          PARTS_RESULT: ${{ needs.part.result }}
          STRIPPED_RESULT: ${{ needs.stripped.result }} # the Settings, chat and launch suites on the build a release ships (#6208)
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          # Each part's newest attempt only: a re-run of the failed parts adds cdp-<part>-a<attempt>
          # beside the first attempt's, and parts that passed keep their first.
          latest = {}
          for d in glob.glob('parts/cdp-*'):
              m = re.fullmatch(r'parts/cdp-(\d+)-a(\d+)', d)
              if m and int(m.group(2)) > latest.get(m.group(1), (0, ''))[0]:
                  latest[m.group(1)] = (int(m.group(2)), d)
          dirs = sorted(d for _, d in latest.values())
          rows = []
          for d in dirs:
              f = os.path.join(d, 'results.json')
              if os.path.exists(f): rows += json.load(open(f))
          by = lambda s: sorted(r['test'] for r in rows if r['status'] == s)
          failed, flaky = by('fail') + by('timeout'), by('flaky')
          passed = len(rows) - len(failed) - len(flaky)
          # The runner's end checks are not suites: the #4354 sandbox (a real agent CLI was
          # invoked), a leaked tmux server and (with --fail-on-leak) a suite that left settings changed fail a part with every suite passed, so read
          # each part's run.log for them too (a 238/238 count once hid six failed parts).
          ends = []
          for f in [os.path.join(d, 'run.log') for d in dirs if os.path.exists(os.path.join(d, 'run.log'))]:
              part, block = f.split('/')[1], None
              for line in open(f, errors='replace'):
                  line = line.rstrip('\n')
                  if line.startswith('FAIL (#4354)') or line.startswith('LEAK:') or line.startswith('SUITES THAT LEAVE SETTINGS CHANGED'):
                      block = [line]; ends.append((part, block)); continue
                  if block is not None:
                      if not line.strip() or line.startswith('results:'): block = None
                      elif len(block) < 6: block.append(line)
          green = os.environ['PARTS_RESULT'] == 'success' and os.environ['STRIPPED_RESULT'] in ('success', 'skipped') and bool(rows) and not (failed or flaky or ends)  # no results read is not green
          lines = [("green: " if green else "NOT green: ") + f"{passed}/{len(rows)} suites passed" + (f", {len(flaky)} FLAKY" if flaky else "") + (f", {len(failed)} FAILED" if failed else "") + (f", {len(ends)} end-check failure(s)" if ends else "") + f"; parts: {os.environ['PARTS_RESULT']}"]
          if flaky: lines.append("FLAKY: " + ", ".join(flaky))
          if failed: lines.append("FAILED: " + ", ".join(failed))
          # Each flaky or failed suite's first failing line, from its first failing attempt (results.json keeps a
          # non-passing attempt's output), so a flake can be fixed from one occurrence without opening the part's log.
          import re as _re
          _pat = _re.compile(r'\[FAIL\]|AssertionError|Error:|timed out|TIMEOUT')
          for r in rows:
              if r.get('status') not in ('flaky', 'fail', 'timeout'): continue
              outs = [a.get('output', '') for a in r.get('attempts', []) if a.get('status') != 'pass'] or [r.get('output', '')]
              first = next((l.strip() for l in (outs[0] or '').splitlines() if _pat.search(l)), '')
              if first: lines.append(f"  {r['test']}: {first[:300]}")
          for part, block in ends: lines.append(f"{part}: " + " / ".join(block))
          # Which suites are worth running again (#5096): each FLAKY one, and a suite a part's end check names when it
          # names exactly one. Only plain file names get through (they reach a workflow input), at most 3.
          _name = _re.compile(r'[a-z0-9_][a-z0-9_.-]*\.test\.m?js')
          again = list(flaky)
          for part, block in ends:
              named = {m for l in block for m in _name.findall(l)}
              if len(named) == 1: again += sorted(named)
          again = [n for n in dict.fromkeys(again) if _name.fullmatch(n)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write("suites=" + ",".join(again[:3]) + "\n")
          if len(again) > 3: lines.append(f"{len(again) - 3} more suite(s) to repeat by hand: " + ", ".join(again[3:]))
          print("\n".join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write("## cdp-gate\n\n" + "\n\n".join(lines) + "\n")
          raise SystemExit(0 if green else 1)
          PY
          echo "parts: $PARTS_RESULT"
          [ "$PARTS_RESULT" = success ]

  repeat:
    # Manual only (workflow_dispatch with suites): the chosen suites, each run inputs.runs times on one shard with
    # no retries (run_cdp_suites.mjs --stress), with the same isolation, pinned Chrome, no cache and stub agent
    # CLIs as the gate, so the #4354 end check still applies. It prints each suite's pass count; the job fails
    # unless every run of every suite passed. The inputs reach the shell only through env and are checked.
    name: cdp (repeat)
    if: github.event_name == 'workflow_dispatch' && inputs.suites != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false # nothing cached here: see the header
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - id: chrome
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1
        with:
          install-dependencies: true
          chrome-version: "155.0.8059.39" # the same pin as cloud-tests.yml; bump both together
      - name: install
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund # exactly package-lock.json, no install scripts (#3675)
      - name: stub agent CLIs first on PATH
        run: |
          stub="$RUNNER_TEMP/stub-cli"
          mkdir -p "$stub"
          for c in claude codex gemini; do
            printf '#!/bin/sh\necho "stub %s: a CDP suite tried to run a real agent CLI ($*)" >&2\nexit 1\n' "$c" > "$stub/$c"
            chmod 755 "$stub/$c"
          done
          echo "$stub" >> "$GITHUB_PATH"
      - name: repeat the suites
        working-directory: tests/frontend
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SUITES: ${{ inputs.suites }}
          RUNS: ${{ inputs.runs }}
          THROTTLE: ${{ inputs.cpu_throttle }}
          SUITE_TIMEOUT: ${{ inputs.suite_timeout }}
        run: |
          set -o pipefail
          [[ "$SUITES" =~ ^[a-z0-9_.][a-z0-9_.-]*(,[a-z0-9_.][a-z0-9_.-]*)*$ ]] || { echo "suites: comma-separated name fragments only (a-z 0-9 _ . -, not starting with -)"; exit 2; }
          [[ "$RUNS" =~ ^[0-9]+$ ]] && [ "$RUNS" -ge 1 ] && [ "$RUNS" -le 50 ] || { echo "runs: a whole number from 1 to 50"; exit 2; }
          [[ "$THROTTLE" =~ ^[1-8]$ ]] || { echo "cpu_throttle: a whole number from 1 to 8"; exit 2; }
          [[ "$SUITE_TIMEOUT" =~ ^[0-9]+$ ]] && [ "$SUITE_TIMEOUT" -ge 1 ] && [ "$SUITE_TIMEOUT" -le 5400 ] || { echo "suite_timeout: a whole number of seconds from 1 to 5400"; exit 2; }
          node run_cdp_suites.mjs --timeout "$SUITE_TIMEOUT" --keep --stress --only "$SUITES" --runs "$RUNS" --shards 1 --cpu-throttle "$THROTTLE" --results-out "$RUNNER_TEMP/results.json" 2>&1 | tee "$RUNNER_TEMP/run.log"
      - name: pass counts
        if: always()
        run: |
          { echo "## cdp repeat"; echo; echo '```'; grep -E '^STRESS:|^[[:space:]]*[0-9]+/[0-9]+ |^pass count|FAIL \(#4354\)|LEAK:' "$RUNNER_TEMP/run.log" || tail -20 "$RUNNER_TEMP/run.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/results.json" "$RUNNER_TEMP/out/" 2>/dev/null || true
          grep -o '/[^ ]*/coral\.log' "$RUNNER_TEMP/run.log" | sort -u | head -200 | while read -r f; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/out/$(echo "$f" | tr '/' '_')"
          done
      - name: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdp-repeat-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: warn

  flake-repeat:
    # A suite the gate found FLAKY (or that a part's end check names) is run again 10 times with no retries, on this
    # candidate and on main, and one line per suite says how each did (#5096): the gate's check stays what the summary
    # job says, this only tells a reviewer whether the flake is new. It does not run for a green gate, and a repeat run
    # (workflow_dispatch with suites) never starts another. The only job with actions: write, to dispatch the existing
    # repeat above on the two refs and to read their results; no secrets, no checkout, nothing cached. The suite names
    # come from the gate's results through an output and are checked again here before use; they reach the shell only
    # through env. "Same rate on both: pre-existing" is information; a person still decides.
    name: cdp-gate (flaky suites repeated)
    needs: summary
    if: always() && needs.summary.outputs.suites != '' && startsWith(github.ref, 'refs/heads/ci/') && (github.event_name == 'push' || inputs.suites == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: true # never changes the gate's own result
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUITES: ${{ needs.summary.outputs.suites }}
      CANDIDATE: ${{ github.ref_name }}
    steps:
      - name: repeat on the candidate and on main
        run: |
          set -euo pipefail
          [[ "$SUITES" =~ ^[a-z0-9_.][a-z0-9_.-]*(,[a-z0-9_.][a-z0-9_.-]*){0,2}$ ]] || { echo "suites: not plain file names"; exit 2; }
          ids() { gh run list --workflow cdp-gate.yml --event workflow_dispatch --branch "$1" --limit 50 --json databaseId -q '.[].databaseId' | sort; }
          # gh workflow run does not say which run it made: the run on that branch that was not there before.
          dispatch() {
            local ref="$1" before new=""
            before="$(ids "$ref")"
            gh workflow run cdp-gate.yml --ref "$ref" -f suites="$SUITES" -f runs=10 >/dev/null
            for _ in $(seq 1 18); do
              sleep 10
              new="$(comm -13 <(printf '%s\n' "$before") <(ids "$ref") | head -n1)"
              [ -n "$new" ] && break
            done
            echo "$new"
          }
          cand_id="$(dispatch "$CANDIDATE")"
          main_id="$(dispatch main)"
          echo "candidate repeat: run ${cand_id:-none}; main repeat: run ${main_id:-none}"
          wait_for() {
            local id="$1" st=""
            [ -n "$id" ] || return 0
            for _ in $(seq 1 240); do
              st="$(gh run view "$id" --json status -q .status)"
              [ "$st" = completed ] && return 0
              sleep 30
            done
          }
          wait_for "$cand_id"
          wait_for "$main_id"
          mkdir -p "$RUNNER_TEMP/cand" "$RUNNER_TEMP/main"
          [ -z "$cand_id" ] || gh run download "$cand_id" -p 'cdp-repeat-*' -D "$RUNNER_TEMP/cand" || true
          [ -z "$main_id" ] || gh run download "$main_id" -p 'cdp-repeat-*' -D "$RUNNER_TEMP/main" || true
          CAND_ID="$cand_id" MAIN_ID="$main_id" python3 - <<'PY'
          import glob, json, os
          def rates(d):
              # {suite: (pass, fail)} from the repeat's results.json; None if the run left none (it never ran, or a suite is not on that ref)
              f = glob.glob(os.path.join(d, '*', 'results.json')) + glob.glob(os.path.join(d, 'results.json'))
              if not f: return None
              out = {}
              for r in json.load(open(f[0])):
                  p, x = out.get(r['test'], (0, 0))
                  out[r['test']] = (p + 1, x) if r['status'] == 'pass' else (p, x + 1)
              return out
          tmp = os.environ['RUNNER_TEMP']
          cand, main = rates(tmp + '/cand'), rates(tmp + '/main')
          lines = []
          for name in os.environ['SUITES'].split(','):
              c = (cand or {}).get(name)
              m = (main or {}).get(name)
              fmt = lambda v, ref: f"{ref} {v[0]} pass / {v[1]} fail" if v else f"{ref} no result"
              line = f"{name}: {fmt(c, 'candidate')}, {fmt(m, 'main')}"
              if c and m:
                  if c[1] == m[1]: note = "same rate on both: pre-existing" if c[1] else "no failure on either"
                  elif c[1] and m[1]: note = "fails on main too, at a different rate"
                  elif c[1]: note = "fails only on the candidate"
                  else: note = "no failure on the candidate; fails on main"
                  line += f" ({note})"
              elif c and not m:
                  line += " (main has no result: the suite may not exist there, or its run failed to start)"
              lines.append(line)
          text = "\n".join(lines)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write("## cdp-gate: flaky suites repeated 10 times\n\n```\n" + text + "\n```\n\nRuns: candidate " + (os.environ['CAND_ID'] or 'none') + ", main " + (os.environ['MAIN_ID'] or 'none') + ". Information only: a person decides.\n")
          PY
