name: CodeQL (trial, never merged)

# Code scanning (#7034): GitHub's CodeQL with the default query suite on the languages the default setup scanned (actions, go, javascript-typescript, python, ruby), with
# tests/ left out by the config file (default setup cannot ignore paths). It runs on pushes to main, on pull requests to it and once a week, as the default setup did.
# The default setup is switched off after this workflow has run green: while both are on, GitHub refuses the analyses of an advanced setup.
on:
  push:
    branches: ["trial/codeql-7034"]

permissions: {}

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: go, build-mode: autobuild }
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: ruby, build-mode: none }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: default
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results
      - name: Which files were scanned
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          python3 -I - <<'PY'
          import glob, json, os
          lang = os.environ["LANGUAGE"]
          files = glob.glob("sarif-results/**/*.sarif", recursive=True)
          assert files, "no sarif for " + lang
          seen, under_tests, results_in_tests = set(), set(), 0
          for f in files:
              for run in json.load(open(f)).get("runs", []):
                  for a in run.get("artifacts", []) or []:
                      u = a.get("location", {}).get("uri", "")
                      seen.add(u)
                      if u.startswith("tests/"):
                          under_tests.add(u)
                  for r in run.get("results", []) or []:
                      for loc in r.get("locations", []) or []:
                          if loc.get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "").startswith("tests/"):
                              results_in_tests += 1
          print(lang, "scanned files:", len(seen), "| under tests/:", len(under_tests), "| results in tests/:", results_in_tests)
          print("sample:", sorted(seen)[:5])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.language }}
          path: sarif-results
