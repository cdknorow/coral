name: Regenerate the Windows settings trace (throwaway)

# A trial branch's own workflow (#6616): never merged. It runs settings_modal_trace_browser with CORAL_UPDATE_GOLDEN=1 on a Windows runner and uploads the rewritten
# Windows golden (a fixture of hashes and readable lines, no personal data) so it can be committed.
on:
  push:
    branches: ["trial/regen-golden-*"]

permissions:
  contents: read

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  regen:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out LF line endings
        shell: bash
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: install
        working-directory: tests/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chrome from the runner image
        id: chrome
        run: |
          p='C:\Program Files\Google\Chrome\Application\chrome.exe'
          [ -f "$p" ] || { echo "::error::no Chrome at $p on this runner image"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"
      - name: rewrite the Windows golden
        working-directory: tests/frontend
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CORAL_UPDATE_GOLDEN: "1"
        run: |
          node run_cdp_suites.mjs --timeout 180 --only settings_modal_trace --shards 1 --retries 0
          git -C ../.. diff --stat -- tests/frontend/fixtures | cat
      - name: the rewritten golden
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-modal-trace-windows-golden
          path: tests/frontend/fixtures/settings_modal_trace.windows.json
          retention-days: 3
