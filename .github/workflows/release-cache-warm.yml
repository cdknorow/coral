name: Release cache warm

# Writes the caches a release restores (#4126 items 1, 2 and 6), from main. A cache saved on a tag
# can't be read by any other tag, and one saved on a ci/ branch is visible only to that branch, so
# the caches a release can read are main's: the bundled tmux payload and the macOS Go caches
# (restored by release.yml, which never saves them), and the Linux setup-go cache (a tag that finds
# main's exact key restores it and saves nothing, instead of uploading ~400 MB it can't share).
#
# A run on another ref (workflow_dispatch on a ci/ branch) writes that branch's caches only: that
# is how a change here is proved, and none of it can reach a release.
#
# Every run also proves the restore path: tmux-restore restores the payload just saved, requires a
# hit, checks it against its manifest and runs the bundled-tmux smoke test, as a release does.

on:
  push:
    branches: [main]
    paths:
      - coral-go/go.mod
      - coral-go/go.sum
      - tools/build-bundled-tmux.sh
      - tools/bundled-tmux-sources.tsv
      - .github/actions/bundled-tmux/**
      - .github/actions/setup-go-macos/**
      - .github/workflows/release-cache-warm.yml
  # Caches unread for 7 days are evicted; a release reads them, and this keeps them between releases
  # (and follows runner image updates, which change the tmux and Go keys).
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  tmux:
    name: tmux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # the payload manifest's build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14, dist: macos-arm64 }
          - { arch: x86_64, runner: macos-15-intel, dist: macos-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bundled-tmux
        with:
          arch: ${{ matrix.arch }}
          out: dist/${{ matrix.dist }}/tmux-payload
          save: "true"
          attested-ref: ${{ github.ref }} # what it restores, it wrote on its own ref

  tmux-restore:
    name: tmux restore check (${{ matrix.arch }})
    needs: [tmux]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14, dist: macos-arm64 }
          - { arch: x86_64, runner: macos-15-intel, dist: macos-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-macos
      - id: tmux
        uses: ./.github/actions/bundled-tmux
        with:
          arch: ${{ matrix.arch }}
          out: dist/${{ matrix.dist }}/tmux-payload
          attested-ref: ${{ github.ref }} # this run's own ref (main on main); a release requires main
      - name: The payload came from the cache
        env:
          HIT: ${{ steps.tmux.outputs.cache-hit }}
        run: test "$HIT" = true || { echo "::error::the tmux payload was not restored with a verified attestation"; exit 1; }
      - name: Smoke test bundled tmux (${{ matrix.arch }})
        working-directory: coral-go
        env:
          CORAL_BUNDLED_TMUX_BIN: ${{ github.workspace }}/dist/${{ matrix.dist }}/tmux-payload/bin/tmux
          CORAL_BUNDLED_TMUX_TERMINFO: ${{ github.workspace }}/dist/${{ matrix.dist }}/tmux-payload/terminfo
        run: go test ./internal/tmux -run '^TestBundledPayloadSmoke$' -count=1

  go-macos:
    name: Go caches (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14 }
          - { arch: amd64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/setup-go-macos
        with:
          cache: restore
      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh
      # The release's build commands, programs and tags (a production tag's), so the build cache
      # holds what a release compiles.
      - name: Build the release binaries (${{ matrix.arch }})
        working-directory: coral-go
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          while IFS='=' read -r k v; do declare "$k=$v"; done < <(bash ../tests/release/resolve_release.sh v0.0.0)
          mkdir -p "$RUNNER_TEMP/out"
          OVERLAY="$(go run ./tools/strip-static)" # the dashboard ships minified (#6208): a fresh owner-only folder; only this step's go build commands read it
          [ -n "$OVERLAY" ] || { echo "strip-static printed no overlay path" >&2; exit 1; }
          trap 'go run ./tools/strip-static -clean "$OVERLAY"' EXIT
          for cmd in $commands; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$ARCH" go build -trimpath -overlay "$OVERLAY" -tags "$build_tags" -ldflags "-s -w" -o "$RUNNER_TEMP/out/$cmd" "./cmd/$cmd/"
          done
          for cmd in $gui_commands; do
            MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0" GOOS=darwin GOARCH="$ARCH" go build -trimpath -overlay "$OVERLAY" -tags "webview,$build_tags" -ldflags "-s -w" -o "$RUNNER_TEMP/out/$cmd" "./cmd/$cmd/"
          done
          (go mod download)
      - name: Save the Go caches
        if: steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  go-linux:
    name: Go caches (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exactly release.yml's build-linux setup, so this run saves under the key a tag looks for.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum
      # Go checks a module against go.sum only when it downloads it, not when it reuses a cached
      # copy: re-hash every restored module (Security's MUST on #4251).
      - name: Verify the restored modules against go.sum
        working-directory: coral-go
        run: |
          set -euo pipefail
          out="$(go mod verify 2>&1)" || true
          echo "$out"
          [ "$out" = "all modules verified" ] || { echo "::error::go mod verify: the module cache does not match go.sum"; exit 1; }
      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh
      - name: Build the release binaries (${{ matrix.arch }})
        working-directory: coral-go
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          while IFS='=' read -r k v; do declare "$k=$v"; done < <(bash ../tests/release/resolve_release.sh v0.0.0)
          mkdir -p "$RUNNER_TEMP/out"
          OVERLAY="$(go run ./tools/strip-static)" # the dashboard ships minified (#6208): a fresh owner-only folder; only this step's go build commands read it
          [ -n "$OVERLAY" ] || { echo "strip-static printed no overlay path" >&2; exit 1; }
          trap 'go run ./tools/strip-static -clean "$OVERLAY"' EXIT
          for cmd in $commands; do
            [ -d "./cmd/$cmd" ] || continue
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -overlay "$OVERLAY" -tags "$build_tags" -ldflags "-s -w" -o "$RUNNER_TEMP/out/$cmd" "./cmd/$cmd/"
          done
          (go mod download)

  # The compiled-package cache (GOCACHE) is keyed by its inputs, but Go doesn't re-check a cached
  # output when it reuses it: like the tmux payload, it is trusted because only this workflow on
  # main writes it. An audit with teeth (Security's SHOULD on #4251): on the scheduled runs (and by
  # hand), build the release programs twice on each runner, once with the restored GOCACHE and once
  # with an empty one, and fail if any binary differs (a Go build is reproducible for the same
  # toolchain, source, flags and path).
  go-cache-audit:
    name: Go cache audit (${{ matrix.os }} ${{ matrix.arch }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [go-macos, go-linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, arch: arm64, runner: macos-14 }
          - { os: macos, arch: amd64, runner: macos-15-intel }
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'macos'
        uses: ./.github/actions/setup-go-macos
        with:
          cache: restore
      - if: matrix.os == 'linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum
      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh
      - name: Build twice, with the restored GOCACHE and with an empty one, and compare
        working-directory: coral-go
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          while IFS='=' read -r k v; do declare "$k=$v"; done < <(bash ../tests/release/resolve_release.sh v0.0.0)
          goos=darwin; [ "$OS" = linux ] && goos=linux
          build() { # $1: output folder
            mkdir -p "$1"
            OVERLAY="$(go run ./tools/strip-static)" # the dashboard ships minified (#6208), a fresh folder per build; a different folder must give the same bytes
            [ -n "$OVERLAY" ] || { echo "strip-static printed no overlay path" >&2; exit 1; }
            for cmd in $commands; do
              [ -d "./cmd/$cmd" ] || continue
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$ARCH" go build -trimpath -overlay "$OVERLAY" -tags "$build_tags" -ldflags "-s -w" -o "$1/$cmd" "./cmd/$cmd/"
            done
            if [ "$OS" = macos ]; then
              for cmd in $gui_commands; do
                MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0" GOOS=darwin GOARCH="$ARCH" go build -trimpath -overlay "$OVERLAY" -tags "webview,$build_tags" -ldflags "-s -w" -o "$1/$cmd" "./cmd/$cmd/"
              done
            fi
            go run ./tools/strip-static -clean "$OVERLAY"
          }
          build "$RUNNER_TEMP/with-cache"
          GOCACHE="$RUNNER_TEMP/empty-gocache" build "$RUNNER_TEMP/without-cache"
          (cd "$RUNNER_TEMP/with-cache" && shasum -a 256 -- * | sort -k2) > "$RUNNER_TEMP/with.sha256"
          (cd "$RUNNER_TEMP/without-cache" && shasum -a 256 -- * | sort -k2) > "$RUNNER_TEMP/without.sha256"
          cat "$RUNNER_TEMP/with.sha256"
          diff "$RUNNER_TEMP/with.sha256" "$RUNNER_TEMP/without.sha256" || { echo "::error::a binary built from the restored GOCACHE differs from one built without it"; exit 1; }
          echo "All $(wc -l < "$RUNNER_TEMP/with.sha256" | tr -d " ") binaries are identical with and without the restored GOCACHE"
