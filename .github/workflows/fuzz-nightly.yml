name: fuzz-nightly
# Nightly fuzzing of the cross-team artifact receive gate and the image strippers (#4391, from
# Security's suggestion on Backend's C4 #4380). The targets ship with a small seed corpus and run
# only ~25 s in the unit suite; this job runs each one for 2 minutes each night on main (a manual run can choose 10m) to find inputs the
# seed corpus does not reach. Each target is its own job (fail-fast: false), so one crash does not
# hide the others.
#
# Trust (the same rules as cdp-gate.yml, #4383): it runs only on a schedule (so, on the default
# branch, main) and by manual dispatch, never on pull_request, so a fork's code never runs here.
# The job has no secrets and read-only contents; actions are pinned by SHA; nothing is cached (a
# cache a scheduled run wrote could be read by a release, #4251). It never commits: a crash is made
# visible by uploading the crasher and failing the job.
#
# Lifetime: GitHub disables a scheduled workflow after 60 days with no repository activity (a commit on
# the default branch); a push or a manual run (Actions > fuzz-nightly > Run workflow) re-enables it. If
# the nightly goes quiet on a slow repo, that is why.
#
# Replaying a crasher locally. A crasher is a HOSTILE input by design (that is what the fuzzer was
# looking for): do not open it in an editor, a viewer or a shell -- hand it only to the Go test, which
# feeds it to the target function in a sandbox and never executes it.
#   1. Open the failed job, download its "fuzz-crashers-<target>" artifact, and unzip it.
#   2. Copy the crasher file it contains (testdata/fuzz/<Target>/<id>) into your checkout at the
#      same path: coral-go/<package>/testdata/fuzz/<Target>/<id> (the package is in the job's matrix, e.g. internal/server/routes)
#   3. Re-run just that input through the test (it fails the same way, fast, no fuzzing):
#        cd coral-go && go test -tags fts5 -run '<Target>/<id>' ./internal/server/routes/
#      e.g. go test -tags fts5 -run 'FuzzStripJPEG/5bd3151860' ./internal/server/routes/
#   Or fuzz the target yourself: go test -tags fts5 -run '^$' -fuzz '^<Target>$' ./internal/server/routes/

on:
  schedule:
    - cron: "27 8 * * *" # 08:27 UTC nightly, off the top of the hour to avoid the scheduler's busiest minute
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "How long each target fuzzes (a trial run can use 30s or 2m)"
        type: choice
        options: ["10m", "2m", "30s"]
        default: "10m"

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

# CI sends no usage events. Its builds carry no PostHog key, and this keeps it so if one ever does (#4936).
env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # ~10 min of fuzzing plus build and startup
    strategy:
      fail-fast: false
      matrix:
        # target: the Fuzz function; pkg: its package under coral-go/ (its crashers land in <pkg>/testdata/fuzz/<target>).
        include:
          # The image strippers and the receive gate (#4380), and the cross-team receive frame (#4389): the metadata parser and the whole-frame handler.
          - {target: FuzzStripJPEG, pkg: internal/server/routes}
          - {target: FuzzStripPNG, pkg: internal/server/routes}
          - {target: FuzzStripGIF, pkg: internal/server/routes}
          - {target: FuzzGateReceived, pkg: internal/server/routes}
          - {target: FuzzParseReceivedMeta, pkg: internal/server/routes}
          - {target: FuzzReceiveExternalArtifactFrame, pkg: internal/server/routes}
          # #5372: the artifact comment anchor, the paste sanitiser every board message goes through, a board key as a path element, the update
          # chain's two network-fed parsers, and the Hub redactor's four targets.
          - {target: FuzzCleanAnchor, pkg: internal/server/routes}
          - {target: FuzzSanitizePaste, pkg: internal/tmux}
          - {target: FuzzUsableBoardKey, pkg: internal/board}
          - {target: FuzzParseSums, pkg: internal/updater/verify}
          - {target: FuzzParseManifest, pkg: internal/updater/verify}
          - {target: FuzzRedactStream, pkg: pkg/redact}
          - {target: FuzzRedactJSON, pkg: pkg/redact}
          - {target: FuzzTrimCut, pkg: pkg/redact}
          - {target: FuzzRedactBoundedStable, pkg: pkg/redact}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: coral-go/go.mod
          cache: false # nothing cached here: see the header
      - name: fuzz ${{ matrix.target }} (2 minutes on the nightly schedule; a manual run chooses)
        working-directory: coral-go
        env: # into the shell as env vars, never interpolated into the run script
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: |
          go test -tags fts5 -run '^$' -fuzz "^${TARGET}\$" -fuzztime "${FUZZTIME}" "./${PKG}/"
      - name: upload the crasher on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: coral-go/${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: warn # a build or setup failure leaves no crasher; the job still fails
          retention-days: 14
