name: Windows rollback test (trial)

# #6921: the rollback of a half-made run worktree retries its RemoveAll once after 300 ms for a file a killed git still holds. Runs the Windows test, then the same test with the retry taken out
# (it must fail). A trial run on a push to a trial/win-rollback-* branch or by hand.
on:
  workflow_dispatch:
  push:
    branches: ["trial/win-rollback-*"]

permissions:
  contents: read

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  rollback:
    name: rollback (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out LF line endings
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: A C compiler for the dev build
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw --version=16.1.0 -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "choco install mingw failed" } }
      - name: the test, then the test without the retry
        working-directory: coral-go
        run: |
          git --version
          go test -count=1 -tags "dev fts5" -run TestRollbackRemovesAHalfMadeFolderWhoseFileIsHeldForAMoment -v ./internal/background 2>&1 | tee "$RUNNER_TEMP/real.log"
          real=${PIPESTATUS[0]}
          python3 - <<'PY'
          p = "internal/background/scheduler.go"
          s = open(p, newline="").read()
          a = "if err != nil {          // on Windows a git killed halfway may hold files for a moment"
          assert s.count(a) == 1, "the retry line is not there exactly once"
          open(p, "w", newline="").write(s.replace(a, "if false && err != nil { // MUTANT: no retry"))
          PY
          go test -count=1 -tags "dev fts5" -run TestRollbackRemovesAHalfMadeFolderWhoseFileIsHeldForAMoment -v ./internal/background 2>&1 | tee "$RUNNER_TEMP/mutant.log"
          mutant=${PIPESTATUS[0]}
          echo "RESULT real=$real (want 0) mutant-without-retry=$mutant (want non-zero)"
          [[ $real -eq 0 && $mutant -ne 0 ]]
