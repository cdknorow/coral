name: Linux runner dry run

# Manual check that the Linux release build still works on a newer runner image
# (for example before moving release.yml off its pinned ubuntu-24.04). Mirrors
# release.yml's build-linux job, but with no secrets, a dry-run version string and
# no uploads; nothing it builds is published.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to build on (an arm64 build needs an arm64 runner, e.g. ubuntu-24.04-arm)"
        required: true
        default: "ubuntu-26.04"
      arch:
        description: "Linux architecture to build: amd64 or arm64 (must match the runner)"
        required: true
        default: "amd64"
        type: choice
        options: [amd64, arm64]

permissions:
  contents: read

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  build-linux:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Runner image
        run: |
          cat /etc/os-release
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
          docker --version
          python3 --version

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum

      - name: Sync agent docs
        run: bash tools/sync-agent-docs.sh

      - name: Build Linux binaries (${{ inputs.arch }})
        working-directory: coral-go
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          LDFLAGS="-s -w -X github.com/subgentic/coral/internal/config.Version=0.0.0-dryrun"
          mkdir -p ../dist/linux
          OVERLAY="$(go run ./tools/strip-static)" # the dashboard ships minified (#6208): a fresh owner-only folder; only this step's go build commands read it
          [ -n "$OVERLAY" ] || { echo "strip-static printed no overlay path" >&2; exit 1; }
          trap 'go run ./tools/strip-static -clean "$OVERLAY"' EXIT
          # The shipped programs: tests/release/commands.txt, as release.yml (#3855).
          for cmd in $(grep -vE '^[[:space:]]*(#|$)' ../tests/release/commands.txt); do
            [ -d "./cmd/$cmd" ] || continue
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build \
              -overlay "$OVERLAY" \
              -tags fts5 \
              -ldflags "$LDFLAGS" \
              -o "../dist/linux/$cmd" \
              "./cmd/$cmd/"
          done
          ../tests/release/verify_standard_bundle.sh ../dist/linux "$ARCH"

      - name: Smoke test package on Ubuntu 22.04
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          package="$PWD/dist/linux"
          docker run --rm --network none --platform "linux/$ARCH" -v "$package:/pkg:ro" ubuntu:22.04 /pkg/coral -h
          docker run --rm --network none --platform "linux/$ARCH" -v "$package:/pkg:ro" ubuntu:22.04 /pkg/launch-coral -h
          docker run --rm --network none --platform "linux/$ARCH" -v "$package:/pkg:ro" ubuntu:22.04 /pkg/coral-board workflow --help

      - name: Verify server and board commands without shared libraries
        run: python3 tests/release/smoke_standard_linux.py dist/linux ${{ inputs.arch }}

      - name: Create tarball
        run: tar czf "dist/coral-linux-${{ inputs.arch }}-dryrun.tar.gz" -C dist/linux .

      # As release.yml's "Smoke test the tarball" (#5306): the dry-run tarball unpacked and run on this runner.
      - name: Smoke test the tarball
        run: tests/release/smoke_linux.sh "dist/coral-linux-${{ inputs.arch }}-dryrun.tar.gz" --version 0.0.0-dryrun
