name: Windows runner dry run

# Manual proof that tests/release/smoke_windows.ps1 - the packaged-build smoke
# test wired into release.yml's build-windows job - passes against a real
# published Windows portable ZIP, without cutting a release. It downloads the
# release asset and runs the same script the release gate runs. No build, no
# secrets, nothing published.
#
# It runs on demand (pick the released version) and automatically on a ci/
# branch that touches the smoke script or the Windows release steps, so a change
# to either is proven on a real Windows runner before it lands.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to smoke test (no leading v), e.g. 1.4.157; empty: the latest published release"
        required: false
        default: ""
  push:
    branches: ["ci/**"]
    paths:
      - "tests/release/smoke_windows.ps1"
      - "tests/release/commands.txt"
      - "tests/release/gui_commands.txt"
      - ".github/workflows/windows-runner-dryrun.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  smoke-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # workflow_dispatch may name a version; with none (and on a push) the latest published release is used, resolved in the first step.
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: coral-go/go.sum

      - name: Download the published portable ZIP and MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:VERSION) {
            # The newest release, a pre-release too (the releases are pre-releases until the operator promotes one), whose packages are all published.
            # (promote-* releases are promotions, not product releases: #326)
            $tag = gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName'
            if ($tag -like 'promote-*') {
              $tag = gh api "repos/${{ github.repository }}/releases?per_page=40" --jq '[.[] | select((.draft | not) and (.tag_name | startswith("promote-") | not))][0].tag_name'
            }
            if ($LASTEXITCODE -ne 0 -or -not $tag) { throw "could not read the latest release" }
            $env:VERSION = $tag.TrimStart('v')
            echo "VERSION=$env:VERSION" >> $env:GITHUB_ENV
          }
          # Whether typed at dispatch or resolved, the version is a plain release version before it becomes a gh argument (never a name with spaces or one that reads as an option).
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$') { throw "not a release version: $env:VERSION" }
          "smoke testing v$env:VERSION"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh release download "v$env:VERSION" --repo "${{ github.repository }}" --pattern "Coral-*-x64-portable.zip" --dir dist
          $zip = Get-ChildItem dist\Coral-*-x64-portable.zip | Select-Object -First 1
          if (-not $zip) { throw "no portable ZIP found for v$env:VERSION" }
          echo "ZIP_PATH=$($zip.FullName)" >> $env:GITHUB_ENV
          gh release download "v$env:VERSION" --repo "${{ github.repository }}" --pattern "Coral-*-x64.msi" --dir dist
          $msi = Get-ChildItem dist\Coral-*-x64.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI found for v$env:VERSION" }
          echo "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV

      - name: Smoke test the portable package and the MSI
        shell: pwsh
        run: |
          Push-Location coral-go
          $standin = Join-Path $env:RUNNER_TEMP 'standin\claude.exe'
          go build -o $standin ./cmd/mock-agent
          if ($LASTEXITCODE -ne 0) { throw "go build ./cmd/mock-agent failed" }
          Pop-Location
          ./tests/release/smoke_windows.ps1 -Zip $env:ZIP_PATH -Msi $env:MSI_PATH -Version $env:VERSION -StandIn $standin
          if ($LASTEXITCODE -ne 0) { throw "smoke_windows.ps1 failed" }
