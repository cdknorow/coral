name: Windows home paths (trial)

# #7070: TestBrowseThroughTheHubWalksDownAndUp and TestSensitivePathAgentCredentials on Windows, and the hub path and file bounds tests around them.
on:
  workflow_dispatch:
  push:
    branches: ["trial/win-7070-*"]

permissions:
  contents: read

env:
  CORAL_TELEMETRY_DISABLED: "1"

jobs:
  home:
    name: home paths (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: coral-go
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out LF line endings
        shell: bash
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: coral-go/go.mod
          cache: false
      - name: Sync agent docs
        run: bash ../tools/sync-agent-docs.sh
      - name: the whole routes package, with the temp folder in its long form (the 8.3 failures are #7069's)
        run: |
          set +e +o pipefail
          long=$(cygpath -l -w "$TEMP")
          export TMP="$long" TEMP="$long"
          start=$(date +%s)
          go test -count=1 -timeout 40m -tags fts5 ./internal/server/routes 2>&1 | tee "$RUNNER_TEMP/routes.log" | grep -E "^(--- FAIL|ok|FAIL|panic)" | cut -c1-200
          echo "ROUTES WALL SECONDS: $(( $(date +%s) - start ))"
          echo "FAILED TESTS: $(grep -c '^--- FAIL' "$RUNNER_TEMP/routes.log")"
