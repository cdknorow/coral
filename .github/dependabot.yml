# Keeps the SHA-pinned GitHub Actions current (#3659, update/install audit item 3). Every workflow
# pins its actions by commit with the version in a comment; Dependabot proposes a new pin (commit
# and comment) when an action releases, so a pin never goes stale and an update is always a
# reviewed change. Also the npm test dependencies (below, #3675); Go modules are updated through the team's own reviewed bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  # The frontend test harness (tests/frontend, CI only; the release never uses npm). Proposals to
  # review, as for actions; package-lock.json is what CI installs (#3675).
  - package-ecosystem: npm
    directory: /tests/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "test(deps)"
