<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Sign in to Coral Hub</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/cloud.css">
    <script src="/static/theme_init.js"></script>
</head>
<body class="cloud-page">
    <main class="cloud-card">
        <h1>Sign in to Coral Hub</h1>
        <p>See and control the agents on all of your Coral servers from one place.</p>
        <form id="magic-form" autocomplete="on">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required autocomplete="email" maxlength="254" placeholder="you@example.com">
            <button id="send" class="cloud-btn primary" type="submit">Email me a sign-in link</button>
        </form>
        <p id="or" class="cloud-divider">or</p>
        <a id="github" class="cloud-btn" href="/auth/github/login">Sign in with GitHub</a>
        <div id="status" class="cloud-status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/static/cloud/signin.js"></script>
</body>
</html>
