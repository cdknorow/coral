{{ define "includes/views/inbox.html" }}
<!-- Inbox tab (#4718, #4811). Where the hub serves the dashboard it is the hub's /inbox page in a frame, made by inbox_tab.js the first time the tab is shown (so no page carries an empty one). On every other Coral the dashboard builds its own: two tabs, as the hub's: Needs you (the agents waiting for input) and Saved for later (saved.js moves the one Saved list into #saved-view); one panel shows at a time. -->
<div id="inbox-view" class="inbox-view" role="region" aria-label="Inbox" style="display:none">
    <div id="inbox-local" class="inbox-local" hidden>
        <div id="inbox-live" class="inbox-live" role="status" aria-live="polite" aria-atomic="true"></div>
        <header class="inbox-head">
            <h2 id="inbox-title" class="inbox-title">Inbox</h2>
        </header>
        <div class="inbox-tabs" role="tablist" aria-label="Inbox" id="inbox-tablist">
            <button type="button" class="inbox-tab" role="tab" id="inbox-tab-needs" aria-controls="inbox-panel-needs" aria-selected="true" tabindex="0"><span class="inbox-tab-label" id="inbox-tab-needs-label">Needs you</span><span class="inbox-tab-count" id="inbox-tab-needs-count" hidden></span></button>
            <button type="button" class="inbox-tab" role="tab" id="inbox-tab-tasks" aria-controls="inbox-panel-tasks" aria-selected="false" tabindex="-1"><span class="inbox-tab-label" id="inbox-tab-tasks-label">Tasks</span><span class="inbox-tab-count" id="inbox-tab-tasks-count" hidden></span></button>
            <button type="button" class="inbox-tab" role="tab" id="inbox-tab-saved" aria-controls="inbox-panel-saved" aria-selected="false" tabindex="-1"><span class="inbox-tab-label" id="inbox-tab-saved-label">Saved</span><span class="inbox-tab-count" id="inbox-tab-saved-count" hidden></span></button>
        </div>
        <section id="inbox-panel-needs" class="inbox-panel" role="tabpanel" aria-labelledby="inbox-tab-needs-label">
            <div id="inbox-needs" class="inbox-needs"><!-- not a named section: the tab panel already is the "Needs you" region, and a second one of the same name is listed twice by a screen reader (#6570) -->
                <ul id="inbox-needs-list" class="inbox-needs-list"></ul>
                <p id="inbox-needs-empty" class="inbox-needs-empty">Nothing needs your input.</p>
            </div>
        </section>
        <section id="inbox-panel-tasks" class="inbox-panel" role="tabpanel" aria-labelledby="inbox-tab-tasks-label" hidden>
            <div id="inbox-tasks-host" class="inbox-tasks-host"></div>
        </section>
        <section id="inbox-panel-saved" class="inbox-panel" role="tabpanel" aria-labelledby="inbox-tab-saved-label" hidden>
            <div id="saved-view" class="saved-view"></div><!-- the panel is the "Saved for later" region (#6570); the hub names its own copy itself -->
        </section>
    </div>
</div>
{{ end }}
