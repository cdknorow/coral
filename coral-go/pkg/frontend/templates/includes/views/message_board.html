{{ define "includes/views/message_board.html" }}
<!-- Message Board View -->
<div id="messageboard-view" class="session-view" style="display:none">
    <div class="session-header mb-view-header">
        <div class="mb-view-header-left">
            <h2 id="messageboard-title">Message Board</h2>
            <span class="badge" id="messageboard-project-badge" style="display:none"></span>
        </div>
        <div class="mb-header-actions" style="margin-left:auto">
            <!-- At phone width the sidebar is an overlay: this opens the same list as a sheet (#3610). -->
            <button type="button" class="mb-action-btn mb-subscribers-btn" id="mb-subscribers-btn" data-on-click="mb-subscribers" aria-haspopup="dialog" aria-controls="mb-subscribers-sheet" aria-expanded="false">Subscribers</button>
            <!-- On a phone Select, Export, Pause and Delete sit in a More menu (#4538, UX #4536): the toolbar keeps one row at
                 any text size. On a wider screen the group is laid out inline as before (display: contents). -->
            <div class="mb-more" id="mb-more">
            <button type="button" class="mb-action-btn mb-more-btn" id="mb-more-btn" data-on-click="mb-more" aria-haspopup="true" aria-expanded="false" aria-controls="mb-more-menu">More <svg class="mb-more-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 6 8 10 12 6"/></svg></button>
            <div class="mb-more-menu" id="mb-more-menu" aria-label="More board actions">
            <button class="mb-action-btn" id="mb-select-btn" style="display:none" data-on-click="mb-select-mode" title="Select messages to export">Select</button>
            <button class="mb-action-btn" id="mb-export-btn" style="display:none" data-on-click="mb-export" title="Export — download board messages as Markdown">Export</button>
            <button class="mb-action-btn" id="mb-pause-btn" style="display:none" data-on-click="mb-pause" title="Pause Board — stops agents from receiving new messages until resumed">Pause Board</button>
            <button class="mb-action-btn mb-action-danger" id="mb-delete-btn" style="display:none" data-on-click="mb-delete-board">Delete</button>
            </div>
            </div>
        </div>
    </div>

    <div class="view-body mb-view-body">
        <!-- Project list (shown when no project selected) -->
        <div id="mb-project-list" class="mb-project-list">
            <div class="empty-state" id="mb-projects-empty">No projects yet</div>
            <ul class="session-list" id="mb-projects-ul"></ul>
        </div>

        <!-- Board view (shown when project selected) -->
        <div id="mb-board" class="mb-board" style="display:none">
            <!-- The board's search, First and Latest (#4771; board_search.js builds the bar here) -->
            <div id="mb-tools" class="mb-tools"></div>
            <!-- Messages -->
            <div class="mb-messages-wrap">
                <div id="mb-messages" class="mb-messages-scroll" tabindex="-1">
                    <div id="mb-sleep-banner" class="mb-sleep-banner" style="display:none">
                        <span>🌙 This team is sleeping. Messages are paused.</span>
                    </div>
                    <div class="empty-state" id="mb-messages-empty">No messages yet</div>
                </div>
                <!-- Reading higher up while posts arrive (#4502): a count and a way to the latest, announced politely -->
                <!-- What arrives at the bottom of the board, said politely to a screen reader (message_board.js announceArrivals) -->
                <div id="mb-announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
                <div id="mb-new-pill" class="mb-new-pill" role="status" aria-live="polite">
                    <button type="button" class="mb-new-pill-btn" data-on-click="mb-jump-latest" hidden></button>
                </div>
            </div>

            <!-- Post form -->
            <div class="mb-post-form">
                <textarea id="mb-post-input" class="mb-post-input" placeholder="Post a message as Developer..." aria-label="Post message to board"
                       rows="2"
                       data-on-keydown="mb-post-key"></textarea>
                <button class="btn btn-primary mb-post-send-btn" data-on-click="mb-post">Send</button>
            </div>
        </div>

        <!-- The Subscribers list is a tab of the right sidebar (#4539; templates/includes/right_dock.html). -->
    </div>

    <!-- The Subscribers sheet (phone width, #3610): a modal, so modal_chrome.js closes it on Escape and
         keeps Tab inside, and focus goes back to the Subscribers button. Inside this view, so it hides
         with it. -->
    <div id="mb-subscribers-sheet" class="modal mb-subscribers-sheet" role="dialog" aria-modal="true" aria-labelledby="mb-subscribers-sheet-title" style="display:none" data-on-click="mb-subscribers-backdrop">
        <div class="modal-content mb-subscribers-sheet-content">
            <div class="mb-subscribers-sheet-header">
                <h3 class="mb-subscribers-title" id="mb-subscribers-sheet-title">Subscribers</h3>
                <button type="button" class="mb-action-btn" data-on-click="mb-subscribers-close">Close</button>
            </div>
            <ul id="mb-subscribers-sheet-list" class="mb-subscribers-list"></ul>
        </div>
    </div>
</div>

{{ end }}
